<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I can eat — 가볍고 빠르게, 오늘 뭐 먹지</title>
<meta name="description" content="즉흥적으로 갈 곳을 정할 때도, 약속 전 미리 찾아볼 때도. I can eat이 가장 빠르고 가볍게 맛집을 찾아드립니다.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍚</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="restaurant-card.css">
<script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#FFFFFF;
    --bg-alt:#FAFAF8;
    --text:#2B2B2E;
    --text-soft:#6B6B70;
    --neutral:#F1EFEA;
    --neutral-border:#E4E1DB;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --maxw:1080px;

    --shadow-card:0 1px 2px rgba(30,28,24,0.04), 0 6px 18px -10px rgba(30,28,24,0.10);
    --shadow-card-hover:0 2px 4px rgba(30,28,24,0.06), 0 18px 32px -16px rgba(30,28,24,0.16);

    --accent-soft:#F6E4D3;
    --accent:#E3A874;
    --accent-strong:#B85C2E;
  }
  html[data-daypart="dinner"]{
    --accent-soft:#DCEBF5;
    --accent:#7FAFC9;
    --accent-strong:#3E7A99;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    letter-spacing:-0.01em;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;}
  button{font-family:inherit;}

  .wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 18px;
  }

  /* ---------- Header ---------- */
  header.site{
    padding:20px 0;
    border-bottom:1px solid transparent;
  }
  header.site .wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .logo{
    font-weight:800;
    font-size:1.05rem;
    letter-spacing:-0.02em;
  }
  .logo span{color:var(--accent-strong);}
  .nav-cta{
    font-size:0.85rem;
    font-weight:600;
    padding:9px 18px;
    border-radius:999px;
    background:var(--text);
    color:#fff;
    text-decoration:none;
    transition:opacity .2s ease;
  }
  .nav-cta:hover{opacity:.82;}
  .header-actions{
    display:flex;
    align-items:center;
    gap:10px;
  }

  /* ---------- Hero ---------- */
  .hero{
    padding:44px 0 60px;
  }
  .hero .wrap{
    display:grid;
    grid-template-columns:1fr;
    gap:32px;
    align-items:center;
  }
  .eyebrow{
    display:inline-block;
    font-size:0.8rem;
    font-weight:600;
    color:var(--accent-strong);
    background:var(--accent-soft);
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:20px;
  }
  h1{
    font-size:clamp(2.1rem,4.6vw,3.4rem);
    font-weight:800;
    line-height:1.22;
    letter-spacing:-0.03em;
    margin:0 0 20px;
  }
  .hero p.lead{
    font-size:1.05rem;
    color:var(--text-soft);
    max-width:480px;
    margin:0 0 32px;
  }

  .hero-visual{
    position:relative;
    aspect-ratio:1/1;
    max-width:240px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    order:-1;
  }
  .blob{
    position:absolute;
    inset:0;
    border-radius:44% 56% 58% 42% / 48% 42% 58% 52%;
    background:var(--accent-soft);
    transition:background .6s ease;
  }
  .hero-visual .emoji{
    position:relative;
    font-size:6rem;
    filter:drop-shadow(0 12px 24px rgba(0,0,0,0.08));
  }

  /* ---------- Section shell ---------- */
  section{padding:56px 0;}
  .section-alt{background:var(--bg-alt);}

  /* ---------- 인기 랭킹 / 맞춤 추천 ---------- */
  .section-heading{
    margin:0 0 6px;
    font-size:1.3rem;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  .section-sub{
    margin:0 0 24px;
    font-size:0.9rem;
    color:var(--text-soft);
  }
  .mini-status{
    text-align:center;
    padding:32px 16px;
    color:var(--text-soft);
    font-size:0.9rem;
    border-radius:var(--radius-lg);
    border:1px solid var(--neutral-border);
    background:var(--bg);
  }
  .mini-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
  }
  /* 카드 자체(.rest-card)는 restaurant-card.css가 담당 — 여기서는 랭킹 전용 배지/카운트만. */
  .mini-card-rank{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px;height:26px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent-strong);
    font-size:0.8rem;
    font-weight:800;
    margin-bottom:10px;
  }
  .mini-card-count{
    margin:8px 0 0;
    font-size:0.78rem;
    font-weight:600;
    color:var(--accent-strong);
  }

  /* ---------- Reveal animation ---------- */
  .reveal{
    opacity:0;
    transform:translateY(16px);
    transition:opacity .6s ease, transform .6s ease;
  }
  .reveal.is-visible{
    opacity:1;
    transform:translateY(0);
  }

  /* ---------- 검색 툴바 ---------- */
  .search-toolbar-section{
    padding:8px 0 40px;
  }
  .search-toolbar{
    display:flex;
    align-items:center;
    gap:8px;
    max-width:640px;
    margin:0 auto;
    background:var(--bg);
    border:2px solid var(--neutral-border);
    border-radius:999px;
    box-shadow:var(--shadow-card);
    padding:5px 5px 5px 21px;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .search-toolbar:focus-within{
    border-color:var(--accent);
    box-shadow:var(--shadow-card-hover);
  }
  .search-toolbar-input{
    flex:1;
    min-width:0;
    border:none;
    outline:none;
    background:transparent;
    padding:12px 0;
    font-size:0.95rem;
    color:var(--text);
  }
  .search-toolbar-input::placeholder{color:var(--text-soft);}
  .search-toolbar-btn{
    flex-shrink:0;
    width:42px;
    height:42px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    color:#fff;
    font-size:1.05rem;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:opacity .18s ease, transform .18s ease;
  }
  .search-toolbar-btn:hover{opacity:.85; transform:translateY(-1px);}

  /* ---------- Footer ---------- */
  footer.site{
    border-top:1px solid var(--neutral-border);
    padding:36px 0;
  }
  footer.site .wrap{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:14px;
  }
  .foot-left{
    font-size:0.85rem;
    color:var(--text-soft);
  }
  .foot-left .logo{display:block; margin-bottom:6px;}
  .foot-right{
    display:flex;
    gap:16px;
    font-size:0.85rem;
    color:var(--text-soft);
  }
  .foot-right a{text-decoration:none;}
  .sns{
    display:flex;
    gap:8px;
  }
  .sns span{
    width:32px;height:32px;
    border-radius:50%;
    background:var(--neutral);
    display:flex;align-items:center;justify-content:center;
    font-size:0.8rem;
    color:var(--text-soft);
  }

  /* ---------- Responsive ---------- */
  /* Base styles above are mobile-first (down to a 345px reference width). */

  /* 태블릿 (768px~) */
  @media (min-width:768px){
    .wrap{padding:0 24px;}
    .hero{padding:64px 0 88px;}
    .hero .wrap{grid-template-columns:1.1fr 0.9fr; gap:48px;}
    .hero-visual{order:0; max-width:320px;}
    section{padding:80px 0;}
    footer.site .wrap{flex-direction:row; align-items:center; justify-content:space-between;}
    .mini-grid{grid-template-columns:repeat(3, 1fr); gap:18px;}
  }

  /* 데스크탑 (1440px~) */
  @media (min-width:1440px){
    .hero-visual{max-width:380px;}
    .mini-grid{grid-template-columns:repeat(5, 1fr); gap:20px;}
  }
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <div class="logo">I can<span> eat</span></div>
    <div class="header-actions">
      <a class="nav-cta" href="mypage.html" id="pocketNavLink" hidden>맛집주머니</a>
      <a class="nav-cta" href="about.html">about</a>
      <div id="authSlot"></div>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div class="hero-copy">
      <span class="eyebrow">맛집 리뷰, 더 가볍게</span>
      <h1>가볍고 빠르게,<br>오늘 뭐 먹지</h1>
      <p class="lead">즉흥적으로 갈 곳을 정할 때도, 약속 전 미리 찾아볼 때도, 여행 중 낯선 동네에서도 — I can eat이 가장 빠른 답을 드립니다.</p>
    </div>
    <div class="hero-visual">
      <div class="blob"></div>
      <div class="emoji">🍽️</div>
    </div>
  </div>
</section>

<section class="search-toolbar-section" id="search">
  <div class="wrap">
    <form class="search-toolbar" id="searchForm" novalidate>
      <input type="text" id="searchInput" class="search-toolbar-input" placeholder="먹고 싶은 메뉴나 지역을 입력해보세요" autocomplete="off">
      <button type="submit" class="search-toolbar-btn" id="searchBtn" aria-label="검색">🔍</button>
    </form>
  </div>
</section>

<section class="section-alt" id="ranking">
  <div class="wrap">
    <h2 class="section-heading">지금 인기 맛집 TOP 5</h2>
    <p class="section-sub">사람들이 가장 많이 담은 맛집이에요.</p>
    <p class="mini-status" id="rankingStatus" hidden></p>
    <div class="mini-grid" id="rankingGrid"></div>
  </div>
</section>

<section id="recoSection" hidden>
  <div class="wrap">
    <h2 class="section-heading" id="recoHeading">맞춤 추천</h2>
    <p class="section-sub" id="recoSub"></p>
    <p class="mini-status" id="recoStatus" hidden></p>
    <div class="mini-grid" id="recoGrid"></div>
  </div>
</section>

<footer class="site">
  <div class="wrap">
    <div class="foot-left">
      <span class="logo">I can<span style="color:var(--accent-strong)"> eat</span></span>
      © 2026 I can eat. All rights reserved.
    </div>
    <div class="foot-right">
      <a href="mailto:hello@icaneat.app">hello@icaneat.app</a>
      <div class="sns">
        <span title="Instagram (준비 중)">IG</span>
        <span title="X (준비 중)">X</span>
      </div>
    </div>
  </div>
</footer>

<script src="auth.js"></script>
<script src="restaurant-card.js"></script>
<script>
  (function(){
    var hour = new Date().getHours();
    var isLunch = hour >= 6 && hour < 17;
    document.documentElement.setAttribute('data-daypart', isLunch ? 'lunch' : 'dinner');
  })();

  (function(){
    'use strict';

    function appendText(parent, tag, className, text){
      var el = document.createElement(tag);
      if (className) el.className = className;
      el.textContent = text;
      parent.appendChild(el);
      return el;
    }

    // get_popular_restaurants RPC row(place_id, place_name, category_name, address, lat, lng, save_count)를
    // restaurant-card.js의 renderCard()가 기대하는 카카오 doc 형태로 맞춰준다.
    function rankingRowToDoc(row){
      return {
        id: row.place_id,
        place_name: row.place_name,
        category_name: row.category_name,
        road_address_name: row.address,
        address_name: row.address,
        x: row.lng,
        y: row.lat,
        phone: null,
        place_url: null,
        distance: null,
      };
    }

    // ---------- 인기 랭킹 (로그인 여부와 무관하게 노출) ----------
    var rankingStatus = document.getElementById('rankingStatus');
    var rankingGrid = document.getElementById('rankingGrid');
    window.icaneatCard.mount(rankingGrid);

    function showRankingStatus(text){
      rankingStatus.hidden = false;
      rankingStatus.textContent = text;
    }

    function renderRanking(rows){
      rankingGrid.innerHTML = '';
      if (rows.length === 0) {
        showRankingStatus('아직 담긴 맛집이 없어요.');
        return;
      }
      rankingStatus.hidden = true;
      rows.forEach(function(row, i){
        var card = window.icaneatCard.renderCard(rankingRowToDoc(row));

        var rankBadge = document.createElement('span');
        rankBadge.className = 'mini-card-rank';
        rankBadge.textContent = String(i + 1);
        card.insertBefore(rankBadge, card.firstChild);

        appendText(card, 'p', 'mini-card-count', (row.save_count || 0) + '명이 담았어요');

        rankingGrid.appendChild(card);
      });
    }

    showRankingStatus('불러오는 중…');
    window.icaneatAuth.getClient()
      .rpc('get_popular_restaurants', { limit_count: 5 })
      .then(function(res){
        if (res.error) {
          console.error('[인기 랭킹] 조회 실패:', res.error.message);
          showRankingStatus('인기 맛집을 불러오지 못했어요.');
          return;
        }
        renderRanking(res.data || []);
      });

    // ---------- 맞춤 추천 (로그인 시에만 노출) ----------
    var recoSection = document.getElementById('recoSection');
    var recoHeading = document.getElementById('recoHeading');
    var recoSub = document.getElementById('recoSub');
    var recoStatus = document.getElementById('recoStatus');
    var recoGrid = document.getElementById('recoGrid');
    window.icaneatCard.mount(recoGrid);

    function hideReco(){
      recoSection.hidden = true;
      recoGrid.innerHTML = '';
    }

    function showRecoStatus(text){
      recoStatus.hidden = false;
      recoStatus.textContent = text;
    }

    // "음식점 > 한식 > 육류,고기" 형태에서 대분류(예: 한식)만 추천 키워드로 사용.
    function extractTopCategory(categoryName){
      if (!categoryName) return null;
      var parts = categoryName.split('>').map(function(s){ return s.trim(); }).filter(Boolean);
      return parts.length > 1 ? parts[1] : parts[0];
    }

    function renderReco(docs){
      recoGrid.innerHTML = '';
      recoStatus.hidden = true;
      docs.forEach(function(doc){
        recoGrid.appendChild(window.icaneatCard.renderCard(doc));
      });
    }

    function fetchRecommendations(keyword, savedIds){
      recoSection.hidden = false;
      recoHeading.textContent = keyword + ' 맛집 추천';
      recoSub.textContent = '자주 담은 "' + keyword + '" 카테고리에서 아직 안 담아본 곳이에요.';
      recoGrid.innerHTML = '';
      showRecoStatus('추천을 불러오는 중…');

      var params = new URLSearchParams();
      params.set('query', keyword);

      fetch('/api/kakao-search?' + params.toString())
        .then(function(res){ return res.json(); })
        .then(function(data){
          if (data.error) throw new Error(data.error);
          var docs = (data.documents || []).filter(function(doc){
            return doc.id && !savedIds.has(doc.id);
          }).slice(0, 5);

          if (docs.length === 0) {
            hideReco();
            return;
          }
          renderReco(docs);
        })
        .catch(function(err){
          console.error('[맞춤 추천] 조회 실패:', err.message);
          hideReco();
        });
    }

    function loadPersonalRecommendation(){
      window.icaneatAuth.getClient()
        .from('saved_restaurants')
        .select('place_id, category_name')
        .then(function(res){
          if (res.error || !res.data || res.data.length === 0) {
            hideReco();
            return;
          }

          var savedIds = new Set(res.data.map(function(r){ return r.place_id; }));
          var freq = {};
          res.data.forEach(function(r){
            var top = extractTopCategory(r.category_name);
            if (!top) return;
            freq[top] = (freq[top] || 0) + 1;
          });

          var topCategory = null;
          var topCount = 0;
          Object.keys(freq).forEach(function(k){
            if (freq[k] > topCount) {
              topCategory = k;
              topCount = freq[k];
            }
          });

          if (!topCategory) {
            hideReco();
            return;
          }
          fetchRecommendations(topCategory, savedIds);
        });
    }

    window.icaneatAuth.onChange(function(user){
      document.getElementById('pocketNavLink').hidden = !user;
      if (user) {
        loadPersonalRecommendation();
      } else {
        hideReco();
      }
    });
  })();

  var searchForm = document.getElementById('searchForm');
  var searchInput = document.getElementById('searchInput');
  var searchBtn = document.getElementById('searchBtn');

  searchForm.addEventListener('submit', function(e){
    e.preventDefault();
    var value = searchInput.value.trim();
    var url = value ? 'restaurants.html?q=' + encodeURIComponent(value) : 'restaurants.html';
    window.location.href = url;
  });

  (function(){
    var DEFAULT_EMOJI = '🔍';
    var HOVER_EMOJIS = ['🍔', '🍲', '🍕', '🍜', '🍣', '🌮'];
    var timer = null;
    var i = 0;

    searchBtn.addEventListener('mouseenter', function(){
      i = 0;
      timer = setInterval(function(){
        searchBtn.textContent = HOVER_EMOJIS[i % HOVER_EMOJIS.length];
        i++;
      }, 180);
    });

    searchBtn.addEventListener('mouseleave', function(){
      clearInterval(timer);
      searchBtn.textContent = DEFAULT_EMOJI;
    });
  })();

  if('IntersectionObserver' in window){
    var observer = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, {threshold:0.15});
    document.querySelectorAll('.reveal').forEach(function(el){ observer.observe(el); });
  } else {
    document.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('is-visible'); });
  }
</script>

</body>
</html>
