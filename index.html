<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I can eat — 가볍고 빠르게, 오늘 뭐 먹지</title>
<meta name="description" content="즉흥적으로 갈 곳을 정할 때도, 약속 전 미리 찾아볼 때도. I can eat이 가장 빠르고 가볍게 맛집을 찾아드립니다.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍚</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#FFFFFF;
    --bg-alt:#FAFAF8;
    --text:#2B2B2E;
    --text-soft:#6B6B70;
    --neutral:#F1EFEA;
    --neutral-border:#E4E1DB;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --maxw:1080px;

    --shadow-card:0 1px 2px rgba(30,28,24,0.04), 0 6px 18px -10px rgba(30,28,24,0.10);
    --shadow-card-hover:0 2px 4px rgba(30,28,24,0.06), 0 18px 32px -16px rgba(30,28,24,0.16);

    --accent-soft:#F6E4D3;
    --accent:#E3A874;
    --accent-strong:#B85C2E;
  }
  html[data-daypart="dinner"]{
    --accent-soft:#DCEBF5;
    --accent:#7FAFC9;
    --accent-strong:#3E7A99;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    letter-spacing:-0.01em;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;}
  button{font-family:inherit;}

  .wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 18px;
  }

  /* ---------- Header ---------- */
  header.site{
    padding:20px 0;
    border-bottom:1px solid transparent;
  }
  header.site .wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .logo{
    font-weight:800;
    font-size:1.05rem;
    letter-spacing:-0.02em;
  }
  .logo span{color:var(--accent-strong);}
  .nav-cta{
    font-size:0.85rem;
    font-weight:600;
    padding:9px 18px;
    border-radius:999px;
    background:var(--text);
    color:#fff;
    text-decoration:none;
    transition:opacity .2s ease;
  }
  .nav-cta:hover{opacity:.82;}

  /* ---------- Hero ---------- */
  .hero{
    padding:44px 0 60px;
  }
  .hero .wrap{
    display:grid;
    grid-template-columns:1fr;
    gap:32px;
    align-items:center;
  }
  .eyebrow{
    display:inline-block;
    font-size:0.8rem;
    font-weight:600;
    color:var(--accent-strong);
    background:var(--accent-soft);
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:20px;
  }
  h1{
    font-size:clamp(2.1rem,4.6vw,3.4rem);
    font-weight:800;
    line-height:1.22;
    letter-spacing:-0.03em;
    margin:0 0 20px;
  }
  .hero p.lead{
    font-size:1.05rem;
    color:var(--text-soft);
    max-width:480px;
    margin:0 0 32px;
  }
  .hero-actions{
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
  }
  .btn-ghost{
    font-size:0.9rem;
    font-weight:600;
    color:var(--text-soft);
    text-decoration:none;
  }

  .hero-visual{
    position:relative;
    aspect-ratio:1/1;
    max-width:240px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    order:-1;
  }
  .blob{
    position:absolute;
    inset:0;
    border-radius:44% 56% 58% 42% / 48% 42% 58% 52%;
    background:var(--accent-soft);
    transition:background .6s ease;
  }
  .hero-visual .emoji{
    position:relative;
    font-size:6rem;
    filter:drop-shadow(0 12px 24px rgba(0,0,0,0.08));
  }

  /* ---------- Section shell ---------- */
  section{padding:56px 0;}
  .section-alt{background:var(--bg-alt);}

  /* ---------- Reveal animation ---------- */
  .reveal{
    opacity:0;
    transform:translateY(16px);
    transition:opacity .6s ease, transform .6s ease;
  }
  .reveal.is-visible{
    opacity:1;
    transform:translateY(0);
  }

  /* ---------- CTA ---------- */
  .cta-box{
    background:var(--text);
    color:#fff;
    border-radius:24px;
    padding:40px 22px;
    text-align:center;
    box-shadow:var(--shadow-card-hover);
  }
  .cta-box h2{
    font-size:clamp(1.4rem,3vw,1.9rem);
    font-weight:700;
    margin:0 0 10px;
    letter-spacing:-0.02em;
  }
  .cta-box p{
    color:rgba(255,255,255,0.68);
    margin:0 0 30px;
    font-size:0.95rem;
  }
  form.signup{
    display:flex;
    flex-direction:column;
    gap:10px;
    max-width:420px;
    margin:0 auto;
  }
  form.signup input[type="text"]{
    flex:1;
    padding:13px 18px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.08);
    color:#fff;
    font-size:0.92rem;
    outline:none;
    transition:border-color .2s ease, background .2s ease;
  }
  form.signup input[type="text"]::placeholder{color:rgba(255,255,255,0.45);}
  form.signup input[type="text"]:focus{
    border-color:var(--accent);
    background:rgba(255,255,255,0.12);
  }
  form.signup button{
    padding:13px 22px;
    border-radius:999px;
    border:none;
    background:var(--accent-strong);
    color:#fff;
    font-weight:700;
    font-size:0.9rem;
    cursor:pointer;
    white-space:nowrap;
    transition:opacity .18s ease, transform .18s ease;
  }
  form.signup button:hover{opacity:.9; transform:translateY(-1px);}

  /* ---------- Footer ---------- */
  footer.site{
    border-top:1px solid var(--neutral-border);
    padding:36px 0;
  }
  footer.site .wrap{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:14px;
  }
  .foot-left{
    font-size:0.85rem;
    color:var(--text-soft);
  }
  .foot-left .logo{display:block; margin-bottom:6px;}
  .foot-right{
    display:flex;
    gap:16px;
    font-size:0.85rem;
    color:var(--text-soft);
  }
  .foot-right a{text-decoration:none;}
  .sns{
    display:flex;
    gap:8px;
  }
  .sns span{
    width:32px;height:32px;
    border-radius:50%;
    background:var(--neutral);
    display:flex;align-items:center;justify-content:center;
    font-size:0.8rem;
    color:var(--text-soft);
  }

  /* ---------- Responsive ---------- */
  /* Base styles above are mobile-first (down to a 345px reference width). */

  /* 태블릿 (768px~) */
  @media (min-width:768px){
    .wrap{padding:0 24px;}
    .hero{padding:64px 0 88px;}
    .hero .wrap{grid-template-columns:1.1fr 0.9fr; gap:48px;}
    .hero-visual{order:0; max-width:320px;}
    section{padding:80px 0;}
    .cta-box{padding:56px 40px; border-radius:28px;}
    form.signup{flex-direction:row;}
    footer.site .wrap{flex-direction:row; align-items:center; justify-content:space-between;}
  }

  /* 데스크탑 (1440px~) */
  @media (min-width:1440px){
    .hero-visual{max-width:380px;}
  }
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <div class="logo">I can<span> eat</span></div>
    <a class="nav-cta" href="about.html">about</a>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div class="hero-copy">
      <span class="eyebrow">맛집 리뷰, 더 가볍게</span>
      <h1>가볍고 빠르게,<br>오늘 뭐 먹지</h1>
      <p class="lead">즉흥적으로 갈 곳을 정할 때도, 약속 전 미리 찾아볼 때도, 여행 중 낯선 동네에서도 — I can eat이 가장 빠른 답을 드립니다.</p>
      <div class="hero-actions">
        <a class="btn-ghost" href="about.html#features">기능 미리보기</a>
      </div>
    </div>
    <div class="hero-visual">
      <div class="blob"></div>
      <div class="emoji">🍽️</div>
    </div>
  </div>
</section>

<section class="section-alt" id="search">
  <div class="wrap">
    <div class="cta-box reveal">
      <h2>지금 맛집을 검색해보세요</h2>
      <p>먹고 싶은 메뉴나 지역을 입력하면 바로 찾아드릴게요.</p>
      <form class="signup" id="searchForm" novalidate>
        <input type="text" id="searchInput" placeholder="먹고 싶은 메뉴나 지역을 입력해보세요" autocomplete="off">
        <button type="submit">검색하러 가기</button>
      </form>
    </div>
  </div>
</section>

<footer class="site">
  <div class="wrap">
    <div class="foot-left">
      <span class="logo">I can<span style="color:var(--accent-strong)"> eat</span></span>
      © 2026 I can eat. All rights reserved.
    </div>
    <div class="foot-right">
      <a href="mailto:hello@icaneat.app">hello@icaneat.app</a>
      <div class="sns">
        <span title="Instagram (준비 중)">IG</span>
        <span title="X (준비 중)">X</span>
      </div>
    </div>
  </div>
</footer>

<script>
  (function(){
    var hour = new Date().getHours();
    var isLunch = hour >= 6 && hour < 17;
    document.documentElement.setAttribute('data-daypart', isLunch ? 'lunch' : 'dinner');
  })();

  var searchForm = document.getElementById('searchForm');
  var searchInput = document.getElementById('searchInput');

  searchForm.addEventListener('submit', function(e){
    e.preventDefault();
    var value = searchInput.value.trim();
    var url = value ? 'restaurants.html?q=' + encodeURIComponent(value) : 'restaurants.html';
    window.location.href = url;
  });

  if('IntersectionObserver' in window){
    var observer = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, {threshold:0.15});
    document.querySelectorAll('.reveal').forEach(function(el){ observer.observe(el); });
  } else {
    document.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('is-visible'); });
  }
</script>

</body>
</html>
