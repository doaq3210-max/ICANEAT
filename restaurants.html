<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I can eat — 맛집 검색</title>
<meta name="description" content="키워드나 카테고리로 주변 맛집/카페를 검색합니다.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍚</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="restaurant-card.css">
<script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* index.html과 동일한 디자인 토큰을 그대로 재사용 (index.html은 수정하지 않음) */
  :root{
    --bg:#FFFFFF;
    --bg-alt:#FAFAF8;
    --text:#2B2B2E;
    --text-soft:#6B6B70;
    --neutral:#F1EFEA;
    --neutral-border:#E4E1DB;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --maxw:1080px;

    --shadow-card:0 1px 2px rgba(30,28,24,0.04), 0 6px 18px -10px rgba(30,28,24,0.10);
    --shadow-card-hover:0 2px 4px rgba(30,28,24,0.06), 0 18px 32px -16px rgba(30,28,24,0.16);

    --accent-soft:#F6E4D3;
    --accent:#E3A874;
    --accent-strong:#B85C2E;
  }
  html[data-daypart="dinner"]{
    --accent-soft:#DCEBF5;
    --accent:#7FAFC9;
    --accent-strong:#3E7A99;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    letter-spacing:-0.01em;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;}
  button{font-family:inherit;}

  .wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 18px;
  }

  /* ---------- Header ---------- */
  header.site{
    padding:20px 0;
    border-bottom:1px solid var(--neutral-border);
  }
  header.site .wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .logo{
    font-weight:800;
    font-size:1.05rem;
    letter-spacing:-0.02em;
    text-decoration:none;
    transition:opacity .2s ease;
  }
  .logo:hover{opacity:.82;}
  .logo span{color:var(--accent-strong);}
  .page-title{
    font-size:0.85rem;
    color:var(--text-soft);
  }
  .header-actions{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .nav-cta{
    font-size:0.85rem;
    font-weight:600;
    padding:9px 18px;
    border-radius:999px;
    background:var(--text);
    color:#fff;
    text-decoration:none;
    transition:opacity .2s ease;
  }
  .nav-cta:hover{opacity:.82;}

  /* ---------- Search section ---------- */
  .search-section{
    padding:28px 0 8px;
  }
  .search-panel{
    background:var(--bg);
    border:1px solid var(--neutral-border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    padding:20px;
  }
  .search-bar{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .search-input{
    flex:1;
    padding:13px 18px;
    border-radius:999px;
    border:1px solid var(--neutral-border);
    background:var(--bg-alt);
    font-size:0.95rem;
    color:var(--text);
    outline:none;
    transition:border-color .2s ease, background .2s ease;
  }
  .search-input:focus{
    border-color:var(--accent);
    background:var(--bg);
  }
  .search-btn{
    padding:13px 24px;
    border-radius:999px;
    border:none;
    background:var(--text);
    color:#fff;
    font-size:0.9rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:opacity .18s ease, transform .18s ease;
  }
  .search-btn:hover{opacity:.85; transform:translateY(-1px);}
  .search-btn:disabled{opacity:.6; transform:none; cursor:not-allowed;}

  .category-filter{
    display:flex;
    gap:8px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .filter-btn{
    padding:9px 18px;
    border-radius:999px;
    border:1px solid var(--neutral-border);
    background:var(--bg);
    color:var(--text-soft);
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .filter-btn:hover{background:var(--neutral);}
  .filter-btn.is-active{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent-strong);
  }
  .filter-btn.is-active:hover{background:var(--accent-soft);}

  .subcategory-filter{
    display:flex;
    gap:6px;
    margin-top:10px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:2px;
  }
  .subcategory-filter::-webkit-scrollbar{display:none;}
  .chip-btn{
    flex-shrink:0;
    padding:6px 14px;
    border-radius:999px;
    border:1px solid var(--neutral-border);
    background:var(--bg-alt);
    color:var(--text-soft);
    font-size:0.78rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .chip-btn:hover{background:var(--neutral);}
  .chip-btn.is-active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .chip-btn.is-active:hover{opacity:.88;}

  .location-note{
    margin:14px 0 0;
    font-size:0.78rem;
    color:var(--text-soft);
  }

  /* ---------- Results section ---------- */
  .results-section{
    padding:24px 0 64px;
  }

  .status-msg{
    text-align:center;
    padding:40px 16px;
    color:var(--text-soft);
    font-size:0.9rem;
    border-radius:var(--radius-lg);
    border:1px solid var(--neutral-border);
    background:var(--bg-alt);
  }
  .status-msg--error{
    color:var(--accent-strong);
  }

  .rest-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:20px;
    margin-top:8px;
  }

  .load-more-wrap{
    display:flex;
    justify-content:center;
    margin-top:28px;
  }
  .load-more-btn{
    padding:12px 28px;
    border-radius:999px;
    border:1px solid var(--neutral-border);
    background:var(--bg);
    color:var(--text);
    font-size:0.88rem;
    font-weight:600;
    cursor:pointer;
    transition:background .2s ease, transform .18s ease, box-shadow .2s ease;
  }
  .load-more-btn:hover{
    background:var(--neutral);
    transform:translateY(-1px);
    box-shadow:var(--shadow-card);
  }
  .load-more-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
    box-shadow:none;
  }

  footer.site{
    padding:24px 0 40px;
    border-top:1px solid var(--neutral-border);
    text-align:center;
    font-size:0.78rem;
    color:var(--text-soft);
  }

  /* ---------- Responsive: 345 / 768 / 1440 ---------- */
  @media (min-width:768px){
    .wrap{padding:0 24px;}
    .search-panel{padding:24px;}
    .search-bar{flex-direction:row;}
    .rest-grid{
      grid-template-columns:repeat(2, 1fr);
      gap:22px;
    }
  }
  @media (min-width:1440px){
    .rest-grid{
      grid-template-columns:repeat(3, 1fr);
      gap:24px;
    }
  }
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="logo" href="index.html">I can <span>eat</span></a>
    <div class="header-actions">
      <span class="page-title">맛집 검색 (베타)</span>
      <a class="nav-cta" href="mypage.html" id="pocketNavLink">맛집주머니</a>
      <div id="authSlot"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="search-section">
    <div class="search-panel">
      <form class="search-bar" id="searchForm">
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="예: 강남 파스타"
          aria-label="검색어"
        >
        <button type="submit" class="search-btn">검색</button>
      </form>

      <div class="category-filter" id="categoryFilter" role="group" aria-label="카테고리 필터">
        <button type="button" class="filter-btn is-active" data-group="restaurant">음식점</button>
        <button type="button" class="filter-btn" data-group="cafe">카페+디저트</button>
        <button type="button" class="filter-btn" data-group="bar">주점</button>
      </div>
      <div class="subcategory-filter" id="subcategoryFilter" role="group" aria-label="세부 카테고리 필터" hidden></div>

      <p class="location-note" id="locationNote">현재 위치를 확인하는 중입니다…</p>
    </div>
  </section>

  <section class="results-section">
    <p class="status-msg" id="statusMsg" hidden></p>
    <div class="rest-grid" id="restGrid"></div>
    <div class="load-more-wrap">
      <button type="button" class="load-more-btn" id="loadMoreBtn" hidden>더 보기</button>
    </div>
  </section>
</main>

<footer class="site">
  <div class="wrap">I can eat — 맛집 검색은 카카오 로컬 API 데이터를 사용합니다.</div>
</footer>

<script src="auth.js"></script>
<script src="restaurant-card.js"></script>
<script>
(function(){
  // index.html과 동일한 시간대별 액센트 전환 로직 (이 페이지는 별도 파일이라 자체적으로 적용 필요)
  var hour = new Date().getHours();
  var daypart = (hour >= 6 && hour < 17) ? 'lunch' : 'dinner';
  document.documentElement.setAttribute('data-daypart', daypart);
})();

(function(){
  'use strict';

  var PROXY_BASE = '/api/kakao-search';
  var SEOUL_CITY_HALL = { lat: 37.532600, lng: 127.024612 };
  var RADIUS_M = 20000;
  var PAGE_SIZE = 15;

  // 카카오 로컬 API에는 '주점' 전용 category_group_code나 한식/중식 같은 하위 카테고리
  // 코드가 없어(음식점=FD6, 카페=CE7만 존재), 하위 카테고리는 category_group_code에
  // 키워드(query)를 함께 보내 좁히는 방식으로 구현한다.
  var CATEGORY_GROUPS = [
    { id: 'restaurant', code: 'FD6',
      subcategories: ['한식', '중식', '일식', '양식', '아시아', '남미/하와이', '분식', '퓨전', '기타'] },
    { id: 'cafe', code: 'CE7',
      subcategories: ['커피', '베이커리', '빙수+아이스크림'] },
    { id: 'bar', code: 'FD6', fixedKeyword: '주점', subcategories: [] }
  ];

  var searchForm = document.getElementById('searchForm');
  var searchInput = document.getElementById('searchInput');
  var categoryFilter = document.getElementById('categoryFilter');
  var subcategoryFilter = document.getElementById('subcategoryFilter');
  var locationNote = document.getElementById('locationNote');
  var statusMsg = document.getElementById('statusMsg');
  var restGrid = document.getElementById('restGrid');
  var loadMoreBtn = document.getElementById('loadMoreBtn');
  var pocketNavLink = document.getElementById('pocketNavLink');

  pocketNavLink.addEventListener('click', function (e) {
    if (!window.icaneatAuth.getUser()) {
      e.preventDefault();
      window.icaneatAuth.requireLogin();
    }
  });

  window.icaneatCard.mount(restGrid);

  var state = {
    group: CATEGORY_GROUPS[0],   // 음식점(FD6) 기본 선택
    subKeyword: null,            // 하위 카테고리(또는 주점의 고정 키워드)
    page: 1,
    loading: false
  };

  var locationPromise = null;

  function getLocation() {
    if (locationPromise) return locationPromise;

    locationPromise = new Promise(function (resolve) {
      if (!('geolocation' in navigator)) {
        locationNote.textContent = '위치 정보를 지원하지 않는 브라우저입니다. 서울시청 기준으로 검색합니다.';
        resolve(SEOUL_CITY_HALL);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (pos) {
          locationNote.textContent = '현재 위치 기준으로 검색합니다.';
          resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude });
        },
        function () {
          locationNote.textContent = '위치 권한이 거부되어 서울시청 기준으로 검색합니다.';
          resolve(SEOUL_CITY_HALL);
        },
        { timeout: 6000 }
      );
    });

    return locationPromise;
  }

  // 페이지 로드 시 미리 위치를 시도해둔다 (검색 시 대기 시간을 줄이기 위함).
  getLocation();

  function showStatus(text, modifier) {
    statusMsg.hidden = false;
    statusMsg.textContent = text;
    statusMsg.className = 'status-msg' + (modifier ? ' status-msg--' + modifier : '');
  }

  function hideStatus() {
    statusMsg.hidden = true;
    statusMsg.textContent = '';
    statusMsg.className = 'status-msg';
  }

  // 카카오 검색 키워드로 보내기 전 "/", "+" 등을 공백으로 바꿔 관련도를 높인다.
  function normalizeKeyword(word) {
    return word.replace(/[/+]/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function renderSubcategories() {
    subcategoryFilter.innerHTML = '';
    var subs = state.group.subcategories;
    if (!subs || subs.length === 0) {
      subcategoryFilter.hidden = true;
      return;
    }
    subcategoryFilter.hidden = false;
    subs.forEach(function (label) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip-btn';
      if (state.subKeyword === label) chip.classList.add('is-active');
      chip.textContent = label;
      chip.dataset.sub = label;
      subcategoryFilter.appendChild(chip);
    });
  }

  subcategoryFilter.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip-btn');
    if (!chip) return;

    var label = chip.dataset.sub;
    // 이미 선택된 하위 카테고리를 다시 누르면 해제(해당 상위 카테고리 전체 보기).
    state.subKeyword = (state.subKeyword === label) ? null : label;
    renderSubcategories();
    runSearch(1, false);
  });

  categoryFilter.addEventListener('click', function (e) {
    var btn = e.target.closest('.filter-btn');
    if (!btn) return;

    Array.prototype.forEach.call(categoryFilter.querySelectorAll('.filter-btn'), function (b) {
      b.classList.remove('is-active');
    });
    btn.classList.add('is-active');

    var groupId = btn.getAttribute('data-group');
    state.group = CATEGORY_GROUPS.filter(function (g) { return g.id === groupId; })[0] || CATEGORY_GROUPS[0];
    state.subKeyword = state.group.fixedKeyword || null;
    renderSubcategories();
    runSearch(1, false);
  });

  renderSubcategories();

  function setLoadingUi(isLoading) {
    state.loading = isLoading;
    loadMoreBtn.disabled = isLoading;
    searchForm.querySelector('.search-btn').disabled = isLoading;
  }

  function runSearch(page, append) {
    if (state.loading) return;
    setLoadingUi(true);

    if (!append) {
      restGrid.innerHTML = '';
      loadMoreBtn.hidden = true;
      window.icaneatCard.closePanel();
    }
    showStatus('검색 중입니다…', 'loading');

    var typedKeyword = searchInput.value.trim();
    var subKeyword = state.subKeyword ? normalizeKeyword(state.subKeyword) : '';
    var keyword = [typedKeyword, subKeyword].filter(Boolean).join(' ');

    var buildAndFetch = function (params) {
      params.set('page', String(page));
      var url = PROXY_BASE + '?' + params.toString();

      return fetch(url).then(function (res) {
        return res.json().then(function (data) {
          if (!res.ok || data.error) {
            throw new Error(data.error || ('검색 요청에 실패했습니다 (상태 코드 ' + res.status + ')'));
          }
          return data;
        });
      });
    };

    var paramsPromise;

    if (keyword) {
      var params = new URLSearchParams();
      params.set('query', keyword);
      params.set('category_group_code', state.group.code);
      paramsPromise = Promise.resolve(params);
    } else {
      paramsPromise = getLocation().then(function (loc) {
        var p = new URLSearchParams();
        p.set('category_group_code', state.group.code);
        p.set('x', String(loc.lng));
        p.set('y', String(loc.lat));
        p.set('radius', String(RADIUS_M));
        return p;
      });
    }

    paramsPromise
      .then(buildAndFetch)
      .then(function (data) {
        var docs = data.documents || [];
        var meta = data.meta || {};

        if (docs.length === 0 && !append) {
          hideStatus();
          showStatus('검색 결과가 없습니다. 다른 키워드로 시도해보세요.', 'empty');
        } else {
          hideStatus();
        }

        docs.forEach(function (doc) {
          restGrid.appendChild(window.icaneatCard.renderCard(doc));
        });

        state.page = page;
        var isEnd = meta.is_end !== undefined ? meta.is_end : true;
        loadMoreBtn.hidden = isEnd || docs.length < PAGE_SIZE;
      })
      .catch(function (err) {
        showStatus('검색 중 오류가 발생했습니다: ' + err.message, 'error');
        loadMoreBtn.hidden = true;
      })
      .finally(function () {
        setLoadingUi(false);
      });
  }

  searchForm.addEventListener('submit', function (e) {
    e.preventDefault();
    runSearch(1, false);
  });

  loadMoreBtn.addEventListener('click', function () {
    runSearch(state.page + 1, true);
  });

  // index.html 검색창에서 ?q=검색어로 넘어온 경우, 그 검색어로 바로 검색한다.
  var initialQuery = new URLSearchParams(window.location.search).get('q');
  if (initialQuery) {
    searchInput.value = initialQuery;
  }

  // 초기 진입 시: 검색어가 있으면 키워드 검색, 없으면 위치 기반 기본 카테고리(음식점) 결과를 보여준다.
  runSearch(1, false);
})();
</script>

</body>
</html>
