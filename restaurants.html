<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I can eat — 맛집 검색</title>
<meta name="description" content="키워드나 카테고리로 주변 맛집/카페를 검색합니다.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍚</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="auth.css">
<script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* index.html과 동일한 디자인 토큰을 그대로 재사용 (index.html은 수정하지 않음) */
  :root{
    --bg:#FFFFFF;
    --bg-alt:#FAFAF8;
    --text:#2B2B2E;
    --text-soft:#6B6B70;
    --neutral:#F1EFEA;
    --neutral-border:#E4E1DB;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --maxw:1080px;

    --shadow-card:0 1px 2px rgba(30,28,24,0.04), 0 6px 18px -10px rgba(30,28,24,0.10);
    --shadow-card-hover:0 2px 4px rgba(30,28,24,0.06), 0 18px 32px -16px rgba(30,28,24,0.16);

    --accent-soft:#F6E4D3;
    --accent:#E3A874;
    --accent-strong:#B85C2E;
  }
  html[data-daypart="dinner"]{
    --accent-soft:#DCEBF5;
    --accent:#7FAFC9;
    --accent-strong:#3E7A99;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    letter-spacing:-0.01em;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;}
  button{font-family:inherit;}

  .wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 18px;
  }

  /* ---------- Header ---------- */
  header.site{
    padding:20px 0;
    border-bottom:1px solid var(--neutral-border);
  }
  header.site .wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .logo{
    font-weight:800;
    font-size:1.05rem;
    letter-spacing:-0.02em;
    text-decoration:none;
    transition:opacity .2s ease;
  }
  .logo:hover{opacity:.82;}
  .logo span{color:var(--accent-strong);}
  .page-title{
    font-size:0.85rem;
    color:var(--text-soft);
  }
  .header-actions{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .nav-cta{
    font-size:0.85rem;
    font-weight:600;
    padding:9px 18px;
    border-radius:999px;
    background:var(--text);
    color:#fff;
    text-decoration:none;
    transition:opacity .2s ease;
  }
  .nav-cta:hover{opacity:.82;}

  /* ---------- Search section ---------- */
  .search-section{
    padding:28px 0 8px;
  }
  .search-panel{
    background:var(--bg);
    border:1px solid var(--neutral-border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    padding:20px;
  }
  .search-bar{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .search-input{
    flex:1;
    padding:13px 18px;
    border-radius:999px;
    border:1px solid var(--neutral-border);
    background:var(--bg-alt);
    font-size:0.95rem;
    color:var(--text);
    outline:none;
    transition:border-color .2s ease, background .2s ease;
  }
  .search-input:focus{
    border-color:var(--accent);
    background:var(--bg);
  }
  .search-btn{
    padding:13px 24px;
    border-radius:999px;
    border:none;
    background:var(--text);
    color:#fff;
    font-size:0.9rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:opacity .18s ease, transform .18s ease;
  }
  .search-btn:hover{opacity:.85; transform:translateY(-1px);}
  .search-btn:disabled{opacity:.6; transform:none; cursor:not-allowed;}

  .category-filter{
    display:flex;
    gap:8px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .filter-btn{
    padding:9px 18px;
    border-radius:999px;
    border:1px solid var(--neutral-border);
    background:var(--bg);
    color:var(--text-soft);
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .filter-btn:hover{background:var(--neutral);}
  .filter-btn.is-active{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent-strong);
  }
  .filter-btn.is-active:hover{background:var(--accent-soft);}

  .location-note{
    margin:14px 0 0;
    font-size:0.78rem;
    color:var(--text-soft);
  }

  /* ---------- Results section ---------- */
  .results-section{
    padding:24px 0 64px;
  }

  .status-msg{
    text-align:center;
    padding:40px 16px;
    color:var(--text-soft);
    font-size:0.9rem;
    border-radius:var(--radius-lg);
    border:1px solid var(--neutral-border);
    background:var(--bg-alt);
  }
  .status-msg--error{
    color:var(--accent-strong);
  }

  .rest-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:20px;
    margin-top:8px;
  }

  .rest-card{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:10px;
    padding:22px;
    border:1px solid var(--neutral-border);
    border-radius:var(--radius-lg);
    background:var(--bg);
    box-shadow:var(--shadow-card);
    transition:transform .22s ease, box-shadow .22s ease;
  }
  .rest-card:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow-card-hover);
  }
  .rest-card-body{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .rest-card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
  }
  .rest-card-name{
    margin:0;
    font-size:1.02rem;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .rest-card-distance{
    flex-shrink:0;
    font-size:0.75rem;
    font-weight:600;
    color:var(--accent-strong);
    background:var(--accent-soft);
    padding:3px 9px;
    border-radius:999px;
    white-space:nowrap;
  }
  .rest-card-top-right{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .rest-card-save{
    flex-shrink:0;
    padding:5px 12px;
    border-radius:999px;
    border:1px solid var(--accent);
    background:var(--bg);
    color:var(--accent-strong);
    font-size:0.75rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:background .18s ease, color .18s ease, border-color .18s ease, transform .18s ease;
  }
  .rest-card-save:hover{
    background:var(--accent-soft);
    transform:translateY(-1px);
  }
  .rest-card-save.is-saved{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .rest-card-save.is-saved:hover{
    opacity:.85;
  }
  .rest-card-category{
    margin:0;
    font-size:0.8rem;
    color:var(--text-soft);
  }
  .rest-card-address{
    margin:2px 0 0;
    font-size:0.85rem;
    color:var(--text);
  }
  .rest-card-phone{
    margin:0;
    font-size:0.85rem;
    color:var(--text-soft);
  }
  .rest-card-link{
    align-self:flex-start;
    margin-top:4px;
    font-size:0.82rem;
    font-weight:600;
    color:var(--accent-strong);
    text-decoration:none;
    border-bottom:1px solid var(--accent);
    padding-bottom:1px;
  }
  .rest-card-link:hover{opacity:.75;}

  .load-more-wrap{
    display:flex;
    justify-content:center;
    margin-top:28px;
  }
  .load-more-btn{
    padding:12px 28px;
    border-radius:999px;
    border:1px solid var(--neutral-border);
    background:var(--bg);
    color:var(--text);
    font-size:0.88rem;
    font-weight:600;
    cursor:pointer;
    transition:background .2s ease, transform .18s ease, box-shadow .2s ease;
  }
  .load-more-btn:hover{
    background:var(--neutral);
    transform:translateY(-1px);
    box-shadow:var(--shadow-card);
  }
  .load-more-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
    box-shadow:none;
  }

  .rest-card.is-active-review{
    border-color:var(--accent);
  }

  /* ---------- Review modal ---------- */
  .review-modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(43,43,46,0.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
  }
  .review-modal-overlay.open{
    display:flex;
  }
  .review-panel{
    width:100%;
    max-width:560px;
    max-height:85vh;
    overflow-y:auto;
    border:1px solid var(--neutral-border);
    border-radius:var(--radius-lg);
    background:var(--bg-alt);
    box-shadow:var(--shadow-card-hover);
  }
  .review-panel-body{
    padding:24px;
  }
  .review-panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:12px;
  }
  .review-panel-name{
    margin:0;
    font-size:1.05rem;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .review-panel-close{
    flex:none;
    width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    border:none;
    background:var(--neutral);
    color:var(--text-soft);
    font-size:1rem;
    line-height:1;
    cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  .review-panel-close:hover{
    background:var(--accent-soft);
    color:var(--accent-strong);
  }
  .review-panel-rating{
    margin:0 0 16px;
    font-size:0.9rem;
    color:var(--text-soft);
  }
  .review-panel-status{
    text-align:center;
    padding:24px 0;
    color:var(--text-soft);
    font-size:0.9rem;
  }
  .review-panel-status--error{
    color:var(--accent-strong);
  }
  .review-list{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin:0;
    padding:0;
    list-style:none;
  }
  .review-item{
    border-top:1px solid var(--neutral-border);
    padding-top:14px;
  }
  .review-item-meta{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:0.8rem;
    color:var(--text-soft);
    margin-bottom:4px;
  }
  .review-item-author{
    font-weight:600;
    color:var(--text);
  }
  .review-item-text{
    margin:0;
    font-size:0.88rem;
    color:var(--text);
  }
  .review-text-toggle{
    margin-top:4px;
    padding:0;
    border:none;
    background:none;
    font-size:0.82rem;
    font-weight:600;
    color:var(--accent-strong);
    cursor:pointer;
  }
  .review-text-toggle:hover{opacity:.75;}
  .review-panel-link{
    display:inline-block;
    margin-top:18px;
    font-size:0.85rem;
    font-weight:600;
    color:var(--accent-strong);
    text-decoration:none;
    border-bottom:1px solid var(--accent);
    padding-bottom:1px;
  }
  .review-panel-link:hover{opacity:.75;}

  /* ---------- AI 분석 ---------- */
  .ai-section{
    margin-top:20px;
    padding-top:18px;
    border-top:1px solid var(--neutral-border);
  }
  .ai-section-title{
    margin:0 0 12px;
    font-size:0.8rem;
    font-weight:700;
    color:var(--text-soft);
  }
  .sentiment-bar{
    display:flex;
    height:10px;
    border-radius:999px;
    overflow:hidden;
    background:var(--neutral);
  }
  .sentiment-bar-seg.positive{ background:#6FAF7C; }
  .sentiment-bar-seg.neutral{ background:#E3C24D; }
  .sentiment-bar-seg.negative{ background:#C6706A; }
  .sentiment-legend{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-top:8px;
    font-size:0.78rem;
    color:var(--text-soft);
  }
  .sentiment-legend-dot{
    width:8px;height:8px;
    border-radius:50%;
    display:inline-block;
    margin-right:4px;
  }
  .sentiment-legend-dot.positive{ background:#6FAF7C; }
  .sentiment-legend-dot.neutral{ background:#E3C24D; }
  .sentiment-legend-dot.negative{ background:#C6706A; }
  .wordcloud-wrap{
    margin-top:18px;
  }
  .wordcloud-canvas{
    width:100%;
    display:block;
  }
  .ai-summary-bubble{
    position:relative;
    margin-top:22px;
    background:var(--bg);
    border:1px solid var(--neutral-border);
    border-radius:var(--radius-md);
    padding:14px 16px;
    font-size:0.9rem;
  }
  .ai-summary-bubble:before{
    content:'';
    position:absolute;
    top:-7px;
    left:24px;
    width:14px;height:14px;
    background:var(--bg);
    border-left:1px solid var(--neutral-border);
    border-top:1px solid var(--neutral-border);
    transform:rotate(45deg);
  }
  .ai-summary-label{
    display:block;
    margin-bottom:6px;
    font-size:0.75rem;
    font-weight:700;
    color:var(--accent-strong);
  }

  footer.site{
    padding:24px 0 40px;
    border-top:1px solid var(--neutral-border);
    text-align:center;
    font-size:0.78rem;
    color:var(--text-soft);
  }

  /* ---------- Responsive: 345 / 768 / 1440 ---------- */
  @media (min-width:768px){
    .wrap{padding:0 24px;}
    .search-panel{padding:24px;}
    .search-bar{flex-direction:row;}
    .rest-grid{
      grid-template-columns:repeat(2, 1fr);
      gap:22px;
    }
  }
  @media (min-width:1440px){
    .rest-grid{
      grid-template-columns:repeat(3, 1fr);
      gap:24px;
    }
  }
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="logo" href="index.html">I can <span>eat</span></a>
    <div class="header-actions">
      <span class="page-title">맛집 검색 (베타)</span>
      <a class="nav-cta" href="mypage.html" id="pocketNavLink">맛집주머니</a>
      <div id="authSlot"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="search-section">
    <div class="search-panel">
      <form class="search-bar" id="searchForm">
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="예: 강남 파스타"
          aria-label="검색어"
        >
        <button type="submit" class="search-btn">검색</button>
      </form>

      <div class="category-filter" id="categoryFilter" role="group" aria-label="카테고리 필터">
        <button type="button" class="filter-btn is-active" data-category="">전체</button>
        <button type="button" class="filter-btn" data-category="FD6">음식점</button>
        <button type="button" class="filter-btn" data-category="CE7">카페</button>
      </div>

      <p class="location-note" id="locationNote">현재 위치를 확인하는 중입니다…</p>
    </div>
  </section>

  <section class="results-section">
    <p class="status-msg" id="statusMsg" hidden></p>
    <div class="rest-grid" id="restGrid"></div>
    <div class="load-more-wrap">
      <button type="button" class="load-more-btn" id="loadMoreBtn" hidden>더 보기</button>
    </div>

    <div class="review-modal-overlay" id="reviewModalOverlay">
      <div class="review-panel" id="reviewPanel">
        <div class="review-panel-body" id="reviewPanelBody"></div>
      </div>
    </div>
  </section>
</main>

<footer class="site">
  <div class="wrap">I can eat — 맛집 검색은 카카오 로컬 API 데이터를 사용합니다.</div>
</footer>

<script src="auth.js"></script>
<script>
(function(){
  // index.html과 동일한 시간대별 액센트 전환 로직 (이 페이지는 별도 파일이라 자체적으로 적용 필요)
  var hour = new Date().getHours();
  var daypart = (hour >= 6 && hour < 17) ? 'lunch' : 'dinner';
  document.documentElement.setAttribute('data-daypart', daypart);
})();

(function(){
  'use strict';

  var PROXY_BASE = '/api/kakao-search';
  var REVIEWS_BASE = '/api/google-reviews';
  var AI_ANALYZE_BASE = '/api/ai-analyze';
  var REVIEW_CACHE_PREFIX = 'icaneat:reviews:';
  var AI_CACHE_PREFIX = 'icaneat:ai:';
  var REVIEW_TEXT_TRUNCATE_LEN = 130;
  var SEOUL_CITY_HALL = { lat: 37.532600, lng: 127.024612 };
  var RADIUS_M = 20000;
  var PAGE_SIZE = 15;

  var searchForm = document.getElementById('searchForm');
  var searchInput = document.getElementById('searchInput');
  var categoryFilter = document.getElementById('categoryFilter');
  var locationNote = document.getElementById('locationNote');
  var statusMsg = document.getElementById('statusMsg');
  var restGrid = document.getElementById('restGrid');
  var loadMoreBtn = document.getElementById('loadMoreBtn');
  var pocketNavLink = document.getElementById('pocketNavLink');

  pocketNavLink.addEventListener('click', function (e) {
    if (!window.icaneatAuth.getUser()) {
      e.preventDefault();
      window.icaneatAuth.requireLogin();
    }
  });

  var state = {
    category: '',      // '', 'FD6', 'CE7'
    keyword: '',
    page: 1,
    loading: false
  };

  var locationPromise = null;

  function getLocation() {
    if (locationPromise) return locationPromise;

    locationPromise = new Promise(function (resolve) {
      if (!('geolocation' in navigator)) {
        locationNote.textContent = '위치 정보를 지원하지 않는 브라우저입니다. 서울시청 기준으로 검색합니다.';
        resolve(SEOUL_CITY_HALL);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (pos) {
          locationNote.textContent = '현재 위치 기준으로 검색합니다.';
          resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude });
        },
        function () {
          locationNote.textContent = '위치 권한이 거부되어 서울시청 기준으로 검색합니다.';
          resolve(SEOUL_CITY_HALL);
        },
        { timeout: 6000 }
      );
    });

    return locationPromise;
  }

  // 페이지 로드 시 미리 위치를 시도해둔다 (검색 시 대기 시간을 줄이기 위함).
  getLocation();

  function showStatus(text, modifier) {
    statusMsg.hidden = false;
    statusMsg.textContent = text;
    statusMsg.className = 'status-msg' + (modifier ? ' status-msg--' + modifier : '');
  }

  function hideStatus() {
    statusMsg.hidden = true;
    statusMsg.textContent = '';
    statusMsg.className = 'status-msg';
  }

  function formatDistance(meters) {
    var n = parseInt(meters, 10);
    if (!n || isNaN(n) || n <= 0) return null;
    if (n < 1000) return n + 'm';
    return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'km';
  }

  function renderCard(doc) {
    var card = document.createElement('article');
    card.className = 'rest-card';
    card.dataset.placeId = doc.id || '';
    card.dataset.placeName = doc.place_name || '';
    card.dataset.category = doc.category_name || '';
    card.dataset.address = doc.road_address_name || doc.address_name || '';
    card.dataset.lat = doc.y || '';
    card.dataset.lng = doc.x || '';

    var body = document.createElement('div');
    body.className = 'rest-card-body';

    var top = document.createElement('div');
    top.className = 'rest-card-top';

    var name = document.createElement('h3');
    name.className = 'rest-card-name';
    name.textContent = doc.place_name || '이름 없음';
    top.appendChild(name);

    var topRight = document.createElement('div');
    topRight.className = 'rest-card-top-right';

    var distanceText = formatDistance(doc.distance);
    if (distanceText) {
      var distEl = document.createElement('span');
      distEl.className = 'rest-card-distance';
      distEl.textContent = distanceText;
      topRight.appendChild(distEl);
    }

    var saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.className = 'rest-card-save';
    saveBtn.textContent = '담기';
    saveBtn.setAttribute('aria-pressed', 'false');
    topRight.appendChild(saveBtn);

    top.appendChild(topRight);

    body.appendChild(top);

    if (doc.category_name) {
      var category = document.createElement('p');
      category.className = 'rest-card-category';
      category.textContent = doc.category_name;
      body.appendChild(category);
    }

    var address = document.createElement('p');
    address.className = 'rest-card-address';
    address.textContent = doc.road_address_name || doc.address_name || '주소 정보 없음';
    body.appendChild(address);

    if (doc.phone) {
      var phone = document.createElement('p');
      phone.className = 'rest-card-phone';
      phone.textContent = doc.phone;
      body.appendChild(phone);
    }

    card.appendChild(body);

    if (doc.place_url) {
      var link = document.createElement('a');
      link.className = 'rest-card-link';
      link.href = doc.place_url;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = '카카오맵에서 보기 →';
      card.appendChild(link);
    }

    return card;
  }

  var reviewModalOverlay = document.getElementById('reviewModalOverlay');
  var reviewPanel = document.getElementById('reviewPanel');
  var reviewPanelBody = document.getElementById('reviewPanelBody');
  var activeReviewCard = null;

  function isPanelOpen() {
    return reviewModalOverlay.classList.contains('open');
  }

  function openPanel() {
    reviewModalOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closePanel() {
    reviewModalOverlay.classList.remove('open');
    document.body.style.overflow = '';
    if (activeReviewCard) {
      activeReviewCard.classList.remove('is-active-review');
      activeReviewCard = null;
    }
  }

  reviewModalOverlay.addEventListener('click', function (e) {
    if (e.target === reviewModalOverlay) closePanel();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && isPanelOpen()) closePanel();
  });

  function buildCacheKey(card, prefix) {
    var id = card.dataset.placeId;
    if (id) return prefix + 'id:' + id;
    var lat = parseFloat(card.dataset.lat);
    var lng = parseFloat(card.dataset.lng);
    return prefix + encodeURIComponent(card.dataset.placeName) + ':' +
      lat.toFixed(4) + ',' + lng.toFixed(4);
  }

  function reviewCacheKey(card) {
    return buildCacheKey(card, REVIEW_CACHE_PREFIX);
  }

  function aiCacheKey(card) {
    return buildCacheKey(card, AI_CACHE_PREFIX);
  }

  function getCachedReview(key) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function setCachedReview(key, data) {
    try {
      localStorage.setItem(key, JSON.stringify(data));
    } catch (e) {
      // 저장 공간 부족, 프라이빗 모드 등 — 캐시 없이 조용히 진행.
    }
  }

  function buildPanelHeader(name) {
    var header = document.createElement('div');
    header.className = 'review-panel-header';

    var h3 = document.createElement('h3');
    h3.className = 'review-panel-name';
    h3.textContent = name || '';
    header.appendChild(h3);

    var closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'review-panel-close';
    closeBtn.setAttribute('aria-label', '리뷰 패널 닫기');
    closeBtn.textContent = '×';
    header.appendChild(closeBtn);

    return header;
  }

  function renderPanelLoading(name) {
    reviewPanelBody.innerHTML = '';
    reviewPanelBody.appendChild(buildPanelHeader(name));
    var status = document.createElement('p');
    status.className = 'review-panel-status';
    status.textContent = '리뷰를 불러오는 중...';
    reviewPanelBody.appendChild(status);
  }

  function renderPanelNotFound(name) {
    reviewPanelBody.innerHTML = '';
    reviewPanelBody.appendChild(buildPanelHeader(name));
    var status = document.createElement('p');
    status.className = 'review-panel-status';
    status.textContent = '리뷰를 찾을 수 없어요.';
    reviewPanelBody.appendChild(status);
  }

  function renderPanelError(name) {
    reviewPanelBody.innerHTML = '';
    reviewPanelBody.appendChild(buildPanelHeader(name));
    var status = document.createElement('p');
    status.className = 'review-panel-status review-panel-status--error';
    status.textContent = '리뷰를 불러오지 못했어요. 잠시 후 다시 시도해주세요.';
    reviewPanelBody.appendChild(status);
  }

  function renderPanelResult(card, data) {
    reviewPanelBody.innerHTML = '';
    reviewPanelBody.appendChild(buildPanelHeader(data.name));

    var ratingP = document.createElement('p');
    ratingP.className = 'review-panel-rating';
    ratingP.textContent = (data.rating != null)
      ? '⭐ ' + data.rating.toFixed(1) + ' (' + (data.userRatingCount || 0) + '개 리뷰)'
      : '평점 정보 없음';
    reviewPanelBody.appendChild(ratingP);

    var list = document.createElement('ul');
    list.className = 'review-list';

    (data.reviews || []).forEach(function (r) {
      var li = document.createElement('li');
      li.className = 'review-item';

      var meta = document.createElement('div');
      meta.className = 'review-item-meta';

      var author = document.createElement('span');
      author.className = 'review-item-author';
      author.textContent = r.author || '익명';
      meta.appendChild(author);

      var ratingSpan = document.createElement('span');
      ratingSpan.textContent = '★'.repeat(Math.round(r.rating || 0));
      meta.appendChild(ratingSpan);

      var timeSpan = document.createElement('span');
      timeSpan.textContent = r.relativeTime || '';
      meta.appendChild(timeSpan);

      li.appendChild(meta);

      var text = document.createElement('p');
      text.className = 'review-item-text';
      var fullText = r.text || '';
      li.appendChild(text);

      if (fullText.length > REVIEW_TEXT_TRUNCATE_LEN) {
        var truncated = fullText.slice(0, REVIEW_TEXT_TRUNCATE_LEN) + '…';
        text.textContent = truncated;

        var toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'review-text-toggle';
        toggle.textContent = '더보기';
        var expanded = false;
        toggle.addEventListener('click', function () {
          expanded = !expanded;
          text.textContent = expanded ? fullText : truncated;
          toggle.textContent = expanded ? '접기' : '더보기';
        });
        li.appendChild(toggle);
      } else {
        text.textContent = fullText;
      }

      list.appendChild(li);
    });

    reviewPanelBody.appendChild(list);

    if ((data.reviews || []).length > 0) {
      var aiRefs = buildAiSection();
      reviewPanelBody.appendChild(aiRefs.section);
      renderAiLoading(aiRefs);
      runAiAnalysis(card, data, aiRefs);
    }

    if (data.mapsUri) {
      var link = document.createElement('a');
      link.className = 'review-panel-link';
      link.href = data.mapsUri;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = '구글 지도에서 전체 리뷰 보기 →';
      reviewPanelBody.appendChild(link);
    }
  }

  function buildAiSection() {
    var section = document.createElement('div');
    section.className = 'ai-section';

    var title = document.createElement('p');
    title.className = 'ai-section-title';
    title.textContent = 'AI 리뷰 분석';
    section.appendChild(title);

    var body = document.createElement('div');
    body.className = 'ai-section-body';
    section.appendChild(body);

    return { section: section, body: body };
  }

  function renderAiLoading(refs) {
    refs.body.innerHTML = '';
    var status = document.createElement('p');
    status.className = 'review-panel-status';
    status.textContent = 'AI가 분석하는 중...';
    refs.body.appendChild(status);
  }

  function renderAiError(refs) {
    refs.body.innerHTML = '';
    var status = document.createElement('p');
    status.className = 'review-panel-status review-panel-status--error';
    status.textContent = 'AI 분석을 불러오지 못했어요.';
    refs.body.appendChild(status);
  }

  function renderAiResult(refs, result) {
    refs.body.innerHTML = '';

    var sentiment = result.sentiment || {};
    var pos = sentiment.positive || 0;
    var neu = sentiment.neutral || 0;
    var neg = sentiment.negative || 0;
    var total = pos + neu + neg || 1;

    var bar = document.createElement('div');
    bar.className = 'sentiment-bar';
    [
      ['positive', pos],
      ['neutral', neu],
      ['negative', neg],
    ].forEach(function (entry) {
      if (entry[1] <= 0) return;
      var seg = document.createElement('div');
      seg.className = 'sentiment-bar-seg ' + entry[0];
      seg.style.flexBasis = (entry[1] / total * 100) + '%';
      bar.appendChild(seg);
    });
    refs.body.appendChild(bar);

    var legend = document.createElement('div');
    legend.className = 'sentiment-legend';
    [
      ['positive', '긍정', pos],
      ['neutral', '보통', neu],
      ['negative', '부정', neg],
    ].forEach(function (entry) {
      var item = document.createElement('span');
      var dot = document.createElement('span');
      dot.className = 'sentiment-legend-dot ' + entry[0];
      item.appendChild(dot);
      item.appendChild(document.createTextNode(entry[1] + ' ' + entry[2]));
      legend.appendChild(item);
    });
    refs.body.appendChild(legend);

    var keywords = Array.isArray(result.keywords) ? result.keywords : [];
    if (keywords.length > 0) {
      var wcWrap = document.createElement('div');
      wcWrap.className = 'wordcloud-wrap';
      var canvas = document.createElement('canvas');
      canvas.className = 'wordcloud-canvas';
      wcWrap.appendChild(canvas);
      refs.body.appendChild(wcWrap);

      canvas.width = reviewPanelBody.clientWidth || 320;
      canvas.height = 220;

      if (window.WordCloud) {
        window.WordCloud(canvas, {
          list: keywords.map(function (k) { return [k.word, k.score || 1]; }),
          weightFactor: function (size) { return size * 5 + 14; },
          fontFamily: "'Pretendard Variable','Pretendard',sans-serif",
          backgroundColor: 'transparent',
          color: function (word) {
            var kw = keywords.filter(function (k) { return k.word === word; })[0];
            return kw && kw.sentiment === 'negative' ? '#C6544B' : '#4C9A6A';
          },
        });
      }
    }

    if (result.summary) {
      var bubble = document.createElement('div');
      bubble.className = 'ai-summary-bubble';
      var label = document.createElement('span');
      label.className = 'ai-summary-label';
      label.textContent = 'AI 총평';
      bubble.appendChild(label);
      bubble.appendChild(document.createTextNode(result.summary));
      refs.body.appendChild(bubble);
    }
  }

  function runAiAnalysis(card, data, refs) {
    var key = aiCacheKey(card);
    var cached = getCachedReview(key);
    if (cached) {
      renderAiResult(refs, cached);
      return;
    }

    fetch(AI_ANALYZE_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: card.dataset.placeName,
        reviews: data.reviews.map(function (r) { return { text: r.text, rating: r.rating }; }),
      }),
    })
      .then(function (res) { return res.json(); })
      .then(function (result) {
        if (activeReviewCard !== card) return;
        if (result.error) throw new Error(result.error);
        setCachedReview(key, result);
        renderAiResult(refs, result);
      })
      .catch(function () {
        if (activeReviewCard === card) renderAiError(refs);
      });
  }

  function setLoadingUi(isLoading) {
    state.loading = isLoading;
    loadMoreBtn.disabled = isLoading;
    searchForm.querySelector('.search-btn').disabled = isLoading;
  }

  function runSearch(page, append) {
    if (state.loading) return;
    setLoadingUi(true);

    if (!append) {
      restGrid.innerHTML = '';
      loadMoreBtn.hidden = true;
      closePanel();
    }
    showStatus('검색 중입니다…', 'loading');

    var keyword = searchInput.value.trim();
    state.keyword = keyword;

    var buildAndFetch = function (params) {
      params.set('page', String(page));
      var url = PROXY_BASE + '?' + params.toString();

      return fetch(url).then(function (res) {
        return res.json().then(function (data) {
          if (!res.ok || data.error) {
            throw new Error(data.error || ('검색 요청에 실패했습니다 (상태 코드 ' + res.status + ')'));
          }
          return data;
        });
      });
    };

    var paramsPromise;

    if (keyword) {
      var params = new URLSearchParams();
      params.set('query', keyword);
      if (state.category) params.set('category_group_code', state.category);
      paramsPromise = Promise.resolve(params);
    } else {
      paramsPromise = getLocation().then(function (loc) {
        var p = new URLSearchParams();
        p.set('category_group_code', state.category || 'FD6');
        p.set('x', String(loc.lng));
        p.set('y', String(loc.lat));
        p.set('radius', String(RADIUS_M));
        return p;
      });
    }

    paramsPromise
      .then(buildAndFetch)
      .then(function (data) {
        var docs = data.documents || [];
        var meta = data.meta || {};

        if (docs.length === 0 && !append) {
          hideStatus();
          showStatus('검색 결과가 없습니다. 다른 키워드로 시도해보세요.', 'empty');
        } else {
          hideStatus();
        }

        docs.forEach(function (doc) {
          restGrid.appendChild(renderCard(doc));
        });
        applySavedStateToAllCards();

        state.page = page;
        var isEnd = meta.is_end !== undefined ? meta.is_end : true;
        loadMoreBtn.hidden = isEnd || docs.length < PAGE_SIZE;
      })
      .catch(function (err) {
        showStatus('검색 중 오류가 발생했습니다: ' + err.message, 'error');
        loadMoreBtn.hidden = true;
      })
      .finally(function () {
        setLoadingUi(false);
      });
  }

  searchForm.addEventListener('submit', function (e) {
    e.preventDefault();
    runSearch(1, false);
  });

  categoryFilter.addEventListener('click', function (e) {
    var btn = e.target.closest('.filter-btn');
    if (!btn) return;

    Array.prototype.forEach.call(categoryFilter.querySelectorAll('.filter-btn'), function (b) {
      b.classList.remove('is-active');
    });
    btn.classList.add('is-active');

    state.category = btn.getAttribute('data-category') || '';
    runSearch(1, false);
  });

  loadMoreBtn.addEventListener('click', function () {
    runSearch(state.page + 1, true);
  });

  // "담기" 버튼: 카드가 검색/더보기로 계속 새로 추가되므로 restGrid에 이벤트 위임.
  // 로그인한 회원만 사용 가능하며, Supabase `saved_restaurants` 테이블에 저장한다
  // (한 유저가 같은 가게를 두 번 담을 수 없도록 DB에 unique 제약이 걸려 있음).
  var savedPlaceIds = new Set();

  function setSaveBtnState(saveBtn, isSaved) {
    saveBtn.classList.toggle('is-saved', isSaved);
    saveBtn.textContent = isSaved ? '담았어요' : '담기';
    saveBtn.setAttribute('aria-pressed', isSaved ? 'true' : 'false');
  }

  function applySavedStateToAllCards() {
    Array.prototype.forEach.call(restGrid.querySelectorAll('.rest-card'), function (card) {
      var btn = card.querySelector('.rest-card-save');
      if (btn) setSaveBtnState(btn, savedPlaceIds.has(card.dataset.placeId));
    });
  }

  function loadSavedPlaceIds() {
    window.icaneatAuth.getClient()
      .from('saved_restaurants')
      .select('place_id')
      .then(function (res) {
        if (res.error) {
          console.error('[담기] 저장 목록 조회 실패:', res.error.message);
          return;
        }
        savedPlaceIds = new Set((res.data || []).map(function (row) { return row.place_id; }));
        applySavedStateToAllCards();
      });
  }

  window.icaneatAuth.onChange(function (user) {
    if (user) {
      loadSavedPlaceIds();
    } else {
      savedPlaceIds.clear();
      applySavedStateToAllCards();
    }
  });

  function toggleSave(saveBtn, card) {
    if (!window.icaneatAuth.getUser()) {
      alert('로그인이 필요합니다.');
      window.icaneatAuth.requireLogin();
      return;
    }

    var placeId = card.dataset.placeId;
    if (!placeId || saveBtn.disabled) return;

    var isSaved = savedPlaceIds.has(placeId);
    saveBtn.disabled = true;

    var supa = window.icaneatAuth.getClient();
    var request = isSaved
      ? supa.from('saved_restaurants').delete().eq('place_id', placeId)
      : supa.from('saved_restaurants').insert({
          place_id: placeId,
          place_name: card.dataset.placeName || '',
          category_name: card.dataset.category || null,
          address: card.dataset.address || null,
          lat: card.dataset.lat ? parseFloat(card.dataset.lat) : null,
          lng: card.dataset.lng ? parseFloat(card.dataset.lng) : null,
        });

    request.then(function (res) {
      saveBtn.disabled = false;

      if (res.error) {
        if (!isSaved && res.error.code === '23505') {
          // 동시 클릭 등으로 이미 담겨있던 경우 — 담김 상태로 동기화.
          savedPlaceIds.add(placeId);
          setSaveBtnState(saveBtn, true);
          return;
        }
        console.error('[담기] 실패:', res.error.message);
        alert('처리 중 문제가 발생했어요. 잠시 후 다시 시도해주세요.');
        return;
      }

      if (isSaved) {
        savedPlaceIds.delete(placeId);
      } else {
        savedPlaceIds.add(placeId);
      }
      setSaveBtnState(saveBtn, !isSaved);
    });
  }

  restGrid.addEventListener('click', function (e) {
    var saveBtn = e.target.closest('.rest-card-save');
    if (!saveBtn) return;

    e.preventDefault();
    e.stopPropagation();

    toggleSave(saveBtn, saveBtn.closest('.rest-card'));
  });

  // 카드 클릭: 구글 리뷰 패널을 열고 채운다. "담기"/카카오맵 링크 클릭은
  // 각자의 동작(토글/이동)이 있으므로 여기서는 무시한다.
  restGrid.addEventListener('click', function (e) {
    if (e.target.closest('.rest-card-save')) return;
    if (e.target.closest('.rest-card-link')) return;

    var card = e.target.closest('.rest-card');
    if (!card) return;

    if (activeReviewCard === card && isPanelOpen()) {
      closePanel();
      return;
    }

    if (activeReviewCard) {
      activeReviewCard.classList.remove('is-active-review');
    }
    activeReviewCard = card;
    card.classList.add('is-active-review');
    openPanel();

    var key = reviewCacheKey(card);
    var cached = getCachedReview(key);
    if (cached) {
      if (cached.found) {
        renderPanelResult(card, cached);
      } else {
        renderPanelNotFound(card.dataset.placeName);
      }
      return;
    }

    renderPanelLoading(card.dataset.placeName);

    var params = new URLSearchParams();
    params.set('name', card.dataset.placeName);
    params.set('lat', card.dataset.lat);
    params.set('lng', card.dataset.lng);

    fetch(REVIEWS_BASE + '?' + params.toString())
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (activeReviewCard !== card) return;
        if (data.error) throw new Error(data.error);
        setCachedReview(key, data);
        if (data.found) {
          renderPanelResult(card, data);
        } else {
          renderPanelNotFound(card.dataset.placeName);
        }
      })
      .catch(function () {
        if (activeReviewCard === card) renderPanelError(card.dataset.placeName);
      });
  });

  reviewPanel.addEventListener('click', function (e) {
    if (e.target.closest('.review-panel-close')) closePanel();
  });

  // index.html 검색창에서 ?q=검색어로 넘어온 경우, 그 검색어로 바로 검색한다.
  var initialQuery = new URLSearchParams(window.location.search).get('q');
  if (initialQuery) {
    searchInput.value = initialQuery;
  }

  // 초기 진입 시: 검색어가 있으면 키워드 검색, 없으면 위치 기반 기본 카테고리(전체→FD6) 결과를 보여준다.
  runSearch(1, false);
})();
</script>
