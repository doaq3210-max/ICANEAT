<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I can eat — 맛집 검색</title>
<meta name="description" content="키워드나 카테고리로 주변 맛집/카페를 검색합니다.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍚</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  /* index.html과 동일한 디자인 토큰을 그대로 재사용 (index.html은 수정하지 않음) */
  :root{
    --bg:#FFFFFF;
    --bg-alt:#FAFAF8;
    --text:#2B2B2E;
    --text-soft:#6B6B70;
    --neutral:#F1EFEA;
    --neutral-border:#E4E1DB;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --maxw:1080px;

    --shadow-card:0 1px 2px rgba(30,28,24,0.04), 0 6px 18px -10px rgba(30,28,24,0.10);
    --shadow-card-hover:0 2px 4px rgba(30,28,24,0.06), 0 18px 32px -16px rgba(30,28,24,0.16);

    --accent-soft:#F6E4D3;
    --accent:#E3A874;
    --accent-strong:#B85C2E;
  }
  html[data-daypart="dinner"]{
    --accent-soft:#DCEBF5;
    --accent:#7FAFC9;
    --accent-strong:#3E7A99;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    letter-spacing:-0.01em;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;}
  button{font-family:inherit;}

  .wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 18px;
  }

  /* ---------- Header ---------- */
  header.site{
    padding:20px 0;
    border-bottom:1px solid var(--neutral-border);
  }
  header.site .wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .logo{
    font-weight:800;
    font-size:1.05rem;
    letter-spacing:-0.02em;
    text-decoration:none;
    transition:opacity .2s ease;
  }
  .logo:hover{opacity:.82;}
  .logo span{color:var(--accent-strong);}
  .page-title{
    font-size:0.85rem;
    color:var(--text-soft);
  }

  /* ---------- Search section ---------- */
  .search-section{
    padding:28px 0 8px;
  }
  .search-panel{
    background:var(--bg);
    border:1px solid var(--neutral-border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    padding:20px;
  }
  .search-bar{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .search-input{
    flex:1;
    padding:13px 18px;
    border-radius:999px;
    border:1px solid var(--neutral-border);
    background:var(--bg-alt);
    font-size:0.95rem;
    color:var(--text);
    outline:none;
    transition:border-color .2s ease, background .2s ease;
  }
  .search-input:focus{
    border-color:var(--accent);
    background:var(--bg);
  }
  .search-btn{
    padding:13px 24px;
    border-radius:999px;
    border:none;
    background:var(--text);
    color:#fff;
    font-size:0.9rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:opacity .18s ease, transform .18s ease;
  }
  .search-btn:hover{opacity:.85; transform:translateY(-1px);}
  .search-btn:disabled{opacity:.6; transform:none; cursor:not-allowed;}

  .category-filter{
    display:flex;
    gap:8px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .filter-btn{
    padding:9px 18px;
    border-radius:999px;
    border:1px solid var(--neutral-border);
    background:var(--bg);
    color:var(--text-soft);
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .filter-btn:hover{background:var(--neutral);}
  .filter-btn.is-active{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent-strong);
  }
  .filter-btn.is-active:hover{background:var(--accent-soft);}

  .location-note{
    margin:14px 0 0;
    font-size:0.78rem;
    color:var(--text-soft);
  }

  /* ---------- Results section ---------- */
  .results-section{
    padding:24px 0 64px;
  }

  .status-msg{
    text-align:center;
    padding:40px 16px;
    color:var(--text-soft);
    font-size:0.9rem;
    border-radius:var(--radius-lg);
    border:1px solid var(--neutral-border);
    background:var(--bg-alt);
  }
  .status-msg--error{
    color:var(--accent-strong);
  }

  .rest-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:20px;
    margin-top:8px;
  }

  .rest-card{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:10px;
    padding:22px;
    border:1px solid var(--neutral-border);
    border-radius:var(--radius-lg);
    background:var(--bg);
    box-shadow:var(--shadow-card);
    transition:transform .22s ease, box-shadow .22s ease;
  }
  .rest-card:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow-card-hover);
  }
  .rest-card-body{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .rest-card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
  }
  .rest-card-name{
    margin:0;
    font-size:1.02rem;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .rest-card-distance{
    flex-shrink:0;
    font-size:0.75rem;
    font-weight:600;
    color:var(--accent-strong);
    background:var(--accent-soft);
    padding:3px 9px;
    border-radius:999px;
    white-space:nowrap;
  }
  .rest-card-top-right{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .rest-card-save{
    flex-shrink:0;
    padding:5px 12px;
    border-radius:999px;
    border:1px solid var(--accent);
    background:var(--bg);
    color:var(--accent-strong);
    font-size:0.75rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:background .18s ease, color .18s ease, border-color .18s ease, transform .18s ease;
  }
  .rest-card-save:hover{
    background:var(--accent-soft);
    transform:translateY(-1px);
  }
  .rest-card-save.is-saved{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .rest-card-save.is-saved:hover{
    opacity:.85;
  }
  .rest-card-category{
    margin:0;
    font-size:0.8rem;
    color:var(--text-soft);
  }
  .rest-card-address{
    margin:2px 0 0;
    font-size:0.85rem;
    color:var(--text);
  }
  .rest-card-phone{
    margin:0;
    font-size:0.85rem;
    color:var(--text-soft);
  }
  .rest-card-link{
    align-self:flex-start;
    margin-top:4px;
    font-size:0.82rem;
    font-weight:600;
    color:var(--accent-strong);
    text-decoration:none;
    border-bottom:1px solid var(--accent);
    padding-bottom:1px;
  }
  .rest-card-link:hover{opacity:.75;}

  .load-more-wrap{
    display:flex;
    justify-content:center;
    margin-top:28px;
  }
  .load-more-btn{
    padding:12px 28px;
    border-radius:999px;
    border:1px solid var(--neutral-border);
    background:var(--bg);
    color:var(--text);
    font-size:0.88rem;
    font-weight:600;
    cursor:pointer;
    transition:background .2s ease, transform .18s ease, box-shadow .2s ease;
  }
  .load-more-btn:hover{
    background:var(--neutral);
    transform:translateY(-1px);
    box-shadow:var(--shadow-card);
  }
  .load-more-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
    box-shadow:none;
  }

  footer.site{
    padding:24px 0 40px;
    border-top:1px solid var(--neutral-border);
    text-align:center;
    font-size:0.78rem;
    color:var(--text-soft);
  }

  /* ---------- Responsive: 345 / 768 / 1440 ---------- */
  @media (min-width:768px){
    .wrap{padding:0 24px;}
    .search-panel{padding:24px;}
    .search-bar{flex-direction:row;}
    .rest-grid{
      grid-template-columns:repeat(2, 1fr);
      gap:22px;
    }
  }
  @media (min-width:1440px){
    .rest-grid{
      grid-template-columns:repeat(3, 1fr);
      gap:24px;
    }
  }
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="logo" href="index.html">I can <span>eat</span></a>
    <span class="page-title">맛집 검색 (베타)</span>
  </div>
</header>

<main class="wrap">
  <section class="search-section">
    <div class="search-panel">
      <form class="search-bar" id="searchForm">
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="예: 강남 파스타"
          aria-label="검색어"
        >
        <button type="submit" class="search-btn">검색</button>
      </form>

      <div class="category-filter" id="categoryFilter" role="group" aria-label="카테고리 필터">
        <button type="button" class="filter-btn is-active" data-category="">전체</button>
        <button type="button" class="filter-btn" data-category="FD6">음식점</button>
        <button type="button" class="filter-btn" data-category="CE7">카페</button>
      </div>

      <p class="location-note" id="locationNote">현재 위치를 확인하는 중입니다…</p>
    </div>
  </section>

  <section class="results-section">
    <p class="status-msg" id="statusMsg" hidden></p>
    <div class="rest-grid" id="restGrid"></div>
    <div class="load-more-wrap">
      <button type="button" class="load-more-btn" id="loadMoreBtn" hidden>더 보기</button>
    </div>
  </section>
</main>

<footer class="site">
  <div class="wrap">I can eat — 맛집 검색은 카카오 로컬 API 데이터를 사용합니다.</div>
</footer>

<script>
(function(){
  // index.html과 동일한 시간대별 액센트 전환 로직 (이 페이지는 별도 파일이라 자체적으로 적용 필요)
  var hour = new Date().getHours();
  var daypart = (hour >= 6 && hour < 17) ? 'lunch' : 'dinner';
  document.documentElement.setAttribute('data-daypart', daypart);
})();

(function(){
  'use strict';

  var PROXY_BASE = 'http://localhost:8787/api/search';
  var SEOUL_CITY_HALL = { lat: 37.532600, lng: 127.024612 };
  var RADIUS_M = 20000;
  var PAGE_SIZE = 15;

  var searchForm = document.getElementById('searchForm');
  var searchInput = document.getElementById('searchInput');
  var categoryFilter = document.getElementById('categoryFilter');
  var locationNote = document.getElementById('locationNote');
  var statusMsg = document.getElementById('statusMsg');
  var restGrid = document.getElementById('restGrid');
  var loadMoreBtn = document.getElementById('loadMoreBtn');

  var state = {
    category: '',      // '', 'FD6', 'CE7'
    keyword: '',
    page: 1,
    loading: false
  };

  var locationPromise = null;

  function getLocation() {
    if (locationPromise) return locationPromise;

    locationPromise = new Promise(function (resolve) {
      if (!('geolocation' in navigator)) {
        locationNote.textContent = '위치 정보를 지원하지 않는 브라우저입니다. 서울시청 기준으로 검색합니다.';
        resolve(SEOUL_CITY_HALL);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (pos) {
          locationNote.textContent = '현재 위치 기준으로 검색합니다.';
          resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude });
        },
        function () {
          locationNote.textContent = '위치 권한이 거부되어 서울시청 기준으로 검색합니다.';
          resolve(SEOUL_CITY_HALL);
        },
        { timeout: 6000 }
      );
    });

    return locationPromise;
  }

  // 페이지 로드 시 미리 위치를 시도해둔다 (검색 시 대기 시간을 줄이기 위함).
  getLocation();

  function showStatus(text, modifier) {
    statusMsg.hidden = false;
    statusMsg.textContent = text;
    statusMsg.className = 'status-msg' + (modifier ? ' status-msg--' + modifier : '');
  }

  function hideStatus() {
    statusMsg.hidden = true;
    statusMsg.textContent = '';
    statusMsg.className = 'status-msg';
  }

  function formatDistance(meters) {
    var n = parseInt(meters, 10);
    if (!n || isNaN(n) || n <= 0) return null;
    if (n < 1000) return n + 'm';
    return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'km';
  }

  function renderCard(doc) {
    var card = document.createElement('article');
    card.className = 'rest-card';

    var body = document.createElement('div');
    body.className = 'rest-card-body';

    var top = document.createElement('div');
    top.className = 'rest-card-top';

    var name = document.createElement('h3');
    name.className = 'rest-card-name';
    name.textContent = doc.place_name || '이름 없음';
    top.appendChild(name);

    var topRight = document.createElement('div');
    topRight.className = 'rest-card-top-right';

    var distanceText = formatDistance(doc.distance);
    if (distanceText) {
      var distEl = document.createElement('span');
      distEl.className = 'rest-card-distance';
      distEl.textContent = distanceText;
      topRight.appendChild(distEl);
    }

    var saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.className = 'rest-card-save';
    saveBtn.textContent = '담기';
    saveBtn.setAttribute('aria-pressed', 'false');
    topRight.appendChild(saveBtn);

    top.appendChild(topRight);

    body.appendChild(top);

    if (doc.category_name) {
      var category = document.createElement('p');
      category.className = 'rest-card-category';
      category.textContent = doc.category_name;
      body.appendChild(category);
    }

    var address = document.createElement('p');
    address.className = 'rest-card-address';
    address.textContent = doc.road_address_name || doc.address_name || '주소 정보 없음';
    body.appendChild(address);

    if (doc.phone) {
      var phone = document.createElement('p');
      phone.className = 'rest-card-phone';
      phone.textContent = doc.phone;
      body.appendChild(phone);
    }

    card.appendChild(body);

    if (doc.place_url) {
      var link = document.createElement('a');
      link.className = 'rest-card-link';
      link.href = doc.place_url;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = '카카오맵에서 보기 →';
      card.appendChild(link);
    }

    return card;
  }

  function setLoadingUi(isLoading) {
    state.loading = isLoading;
    loadMoreBtn.disabled = isLoading;
    searchForm.querySelector('.search-btn').disabled = isLoading;
  }

  function runSearch(page, append) {
    if (state.loading) return;
    setLoadingUi(true);

    if (!append) {
      restGrid.innerHTML = '';
      loadMoreBtn.hidden = true;
    }
    showStatus('검색 중입니다…', 'loading');

    var keyword = searchInput.value.trim();
    state.keyword = keyword;

    var buildAndFetch = function (params) {
      params.set('page', String(page));
      var url = PROXY_BASE + '?' + params.toString();

      return fetch(url).then(function (res) {
        return res.json().then(function (data) {
          if (!res.ok || data.error) {
            throw new Error(data.error || ('검색 요청에 실패했습니다 (상태 코드 ' + res.status + ')'));
          }
          return data;
        });
      });
    };

    var paramsPromise;

    if (keyword) {
      var params = new URLSearchParams();
      params.set('query', keyword);
      if (state.category) params.set('category_group_code', state.category);
      paramsPromise = Promise.resolve(params);
    } else {
      paramsPromise = getLocation().then(function (loc) {
        var p = new URLSearchParams();
        p.set('category_group_code', state.category || 'FD6');
        p.set('x', String(loc.lng));
        p.set('y', String(loc.lat));
        p.set('radius', String(RADIUS_M));
        return p;
      });
    }

    paramsPromise
      .then(buildAndFetch)
      .then(function (data) {
        var docs = data.documents || [];
        var meta = data.meta || {};

        if (docs.length === 0 && !append) {
          hideStatus();
          showStatus('검색 결과가 없습니다. 다른 키워드로 시도해보세요.', 'empty');
        } else {
          hideStatus();
        }

        docs.forEach(function (doc) {
          restGrid.appendChild(renderCard(doc));
        });

        state.page = page;
        var isEnd = meta.is_end !== undefined ? meta.is_end : true;
        loadMoreBtn.hidden = isEnd || docs.length < PAGE_SIZE;
      })
      .catch(function (err) {
        showStatus('검색 중 오류가 발생했습니다: ' + err.message, 'error');
        loadMoreBtn.hidden = true;
      })
      .finally(function () {
        setLoadingUi(false);
      });
  }

  searchForm.addEventListener('submit', function (e) {
    e.preventDefault();
    runSearch(1, false);
  });

  categoryFilter.addEventListener('click', function (e) {
    var btn = e.target.closest('.filter-btn');
    if (!btn) return;

    Array.prototype.forEach.call(categoryFilter.querySelectorAll('.filter-btn'), function (b) {
      b.classList.remove('is-active');
    });
    btn.classList.add('is-active');

    state.category = btn.getAttribute('data-category') || '';
    runSearch(1, false);
  });

  loadMoreBtn.addEventListener('click', function () {
    runSearch(state.page + 1, true);
  });

  // "담기" 버튼: 카드가 검색/더보기로 계속 새로 추가되므로 restGrid에 이벤트 위임.
  // 오늘 스코프에서는 실제 저장(localStorage/서버) 없이 UI 상태 토글만 수행하며,
  // 새로고침하거나 다시 검색하면 초기화된다.
  restGrid.addEventListener('click', function (e) {
    var saveBtn = e.target.closest('.rest-card-save');
    if (!saveBtn) return;

    e.preventDefault();
    e.stopPropagation();

    var isSaved = saveBtn.classList.toggle('is-saved');
    saveBtn.textContent = isSaved ? '담았어요' : '담기';
    saveBtn.setAttribute('aria-pressed', isSaved ? 'true' : 'false');
  });

  // 초기 진입 시: 위치 기반으로 기본 카테고리(전체→FD6) 결과를 보여준다.
  runSearch(1, false);
})();
</script>

</body>
</html>
