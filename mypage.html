<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I can eat — 맛집주머니</title>
<meta name="description" content="내가 담은 맛집을 모아 봅니다.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍚</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="auth.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* restaurants.html과 동일한 디자인 토큰을 그대로 재사용 */
  :root{
    --bg:#FFFFFF;
    --bg-alt:#FAFAF8;
    --text:#2B2B2E;
    --text-soft:#6B6B70;
    --neutral:#F1EFEA;
    --neutral-border:#E4E1DB;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --maxw:1080px;

    --shadow-card:0 1px 2px rgba(30,28,24,0.04), 0 6px 18px -10px rgba(30,28,24,0.10);
    --shadow-card-hover:0 2px 4px rgba(30,28,24,0.06), 0 18px 32px -16px rgba(30,28,24,0.16);

    --accent-soft:#F6E4D3;
    --accent:#E3A874;
    --accent-strong:#B85C2E;
  }
  html[data-daypart="dinner"]{
    --accent-soft:#DCEBF5;
    --accent:#7FAFC9;
    --accent-strong:#3E7A99;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    letter-spacing:-0.01em;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;}
  button{font-family:inherit;}

  .wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 18px;
  }

  /* ---------- Header ---------- */
  header.site{
    padding:20px 0;
  }
  header.site .wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .logo{
    font-weight:800;
    font-size:1.05rem;
    letter-spacing:-0.02em;
    text-decoration:none;
    transition:opacity .2s ease;
  }
  .logo:hover{opacity:.82;}
  .logo span{color:var(--accent-strong);}
  .header-actions{
    display:flex;
    align-items:center;
    gap:10px;
  }

  /* ---------- 주요 기능 바로가기 (퀵링크 칩) ---------- */
  .quick-nav-wrap{
    border-bottom:1px solid var(--neutral-border);
  }
  .quick-nav{
    display:flex;
    gap:8px;
    max-width:var(--maxw);
    margin:0 auto;
    padding:2px 18px 14px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .quick-nav::-webkit-scrollbar{display:none;}
  .quick-nav-item{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:6px;
    padding:13px 18px;
    border-radius:999px;
    border:1px solid var(--neutral-border);
    background:var(--bg);
    color:var(--text-soft);
    font-size:0.82rem;
    font-weight:600;
    text-decoration:none;
    white-space:nowrap;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .quick-nav-item:hover{background:var(--neutral);}
  .quick-nav-item.is-active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:700;
  }
  .quick-nav-item svg{flex-shrink:0;}

  /* ---------- Content ---------- */
  .pocket-section{
    padding:28px 0 64px;
  }
  .pocket-heading{
    margin:0 0 20px;
    font-size:1.3rem;
    font-weight:800;
    letter-spacing:-0.02em;
  }

  .status-msg{
    text-align:center;
    padding:40px 16px;
    color:var(--text-soft);
    font-size:0.9rem;
    border-radius:var(--radius-lg);
    border:1px solid var(--neutral-border);
    background:var(--bg-alt);
  }
  .status-msg--error{
    color:var(--accent-strong);
  }

  .pocket-empty{
    text-align:center;
    padding:56px 20px;
    color:var(--text-soft);
    font-size:0.95rem;
    border-radius:var(--radius-lg);
    border:1px solid var(--neutral-border);
    background:var(--bg-alt);
  }
  .pocket-empty p{margin:0 0 20px;}
  .pocket-empty-btn{
    display:inline-block;
    padding:12px 26px;
    border-radius:999px;
    background:var(--text);
    color:#fff;
    font-size:0.88rem;
    font-weight:600;
    text-decoration:none;
    transition:opacity .2s ease, transform .18s ease;
  }
  .pocket-empty-btn:hover{opacity:.85; transform:translateY(-1px);}

  .pocket-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:20px;
  }

  .pocket-card{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:22px;
    border:1px solid var(--neutral-border);
    border-radius:var(--radius-lg);
    background:var(--bg);
    box-shadow:var(--shadow-card);
    transition:transform .22s ease, box-shadow .22s ease;
  }
  .pocket-card:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow-card-hover);
  }
  .pocket-card-remove{
    position:absolute;
    top:16px;
    right:16px;
    width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    border:none;
    background:var(--neutral);
    color:var(--text-soft);
    font-size:1rem;
    line-height:1;
    cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  .pocket-card-remove:hover{
    background:var(--accent-soft);
    color:var(--accent-strong);
  }
  .pocket-card-remove:disabled{
    opacity:.5;
    cursor:not-allowed;
  }
  .pocket-card-name{
    margin:0;
    padding-right:32px;
    font-size:1.02rem;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .pocket-card-category{
    margin:0;
    font-size:0.8rem;
    color:var(--text-soft);
  }
  .pocket-card-address{
    margin:0;
    font-size:0.85rem;
    color:var(--text);
  }
  .pocket-card-date{
    margin:0;
    font-size:0.78rem;
    color:var(--text-soft);
  }
  .pocket-card-link{
    align-self:flex-start;
    margin-top:6px;
    font-size:0.82rem;
    font-weight:600;
    color:var(--accent-strong);
    text-decoration:none;
    border-bottom:1px solid var(--accent);
    padding-bottom:1px;
  }
  .pocket-card-link:hover{opacity:.75;}
  .pocket-card-rating-badge{
    display:inline-block;
    align-self:flex-start;
    margin:0;
    padding:3px 10px;
    border-radius:999px;
    background:var(--accent-soft);
    color:var(--accent-strong);
    font-size:0.75rem;
    font-weight:700;
  }
  .pocket-card-review{
    margin:0;
    font-size:0.85rem;
    color:var(--text);
    font-style:italic;
  }
  .pocket-card-visit-btn{
    align-self:flex-start;
    margin-top:2px;
    padding:6px 14px;
    border-radius:999px;
    border:1px solid var(--accent);
    background:var(--bg);
    color:var(--accent-strong);
    font-size:0.78rem;
    font-weight:600;
    cursor:pointer;
    transition:background .18s ease, color .18s ease, transform .18s ease;
  }
  .pocket-card-visit-btn:hover{
    background:var(--accent-soft);
    transform:translateY(-1px);
  }
  .pocket-card-visit-btn.is-visited{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .pocket-card-visit-btn.is-visited:hover{opacity:.85;}

  /* ---------- 가볼곳 / 가본곳 그룹 ---------- */
  .pocket-group{margin-bottom:40px;}
  .pocket-group:last-child{margin-bottom:0;}
  .pocket-group-heading{
    margin:0 0 14px;
    font-size:1.05rem;
    font-weight:700;
    letter-spacing:-0.02em;
  }
  .pocket-group-empty{
    padding:22px 16px;
    text-align:center;
    color:var(--text-soft);
    font-size:0.85rem;
    border-radius:var(--radius-md);
    border:1px dashed var(--neutral-border);
  }

  /* ---------- 내 기록 모달 ---------- */
  .record-modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(43,43,46,0.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
  }
  .record-modal-overlay.open{display:flex;}
  .record-panel{
    width:100%;
    max-width:420px;
    max-height:85vh;
    overflow-y:auto;
    border:1px solid var(--neutral-border);
    border-radius:var(--radius-lg);
    background:var(--bg-alt);
    box-shadow:var(--shadow-card-hover);
    padding:24px;
  }
  .record-panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:4px;
  }
  .record-panel-name{
    margin:0;
    font-size:1.05rem;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .record-panel-close{
    flex:none;
    width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    border:none;
    background:var(--neutral);
    color:var(--text-soft);
    font-size:1rem;
    line-height:1;
    cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  .record-panel-close:hover{
    background:var(--accent-soft);
    color:var(--accent-strong);
  }
  .record-panel-meta{
    margin:0 0 18px;
    font-size:0.85rem;
    color:var(--text-soft);
  }
  .record-panel-label{
    display:block;
    margin:0 0 8px;
    font-size:0.8rem;
    font-weight:700;
    color:var(--text-soft);
  }
  .record-rating-group{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .record-rating-btn{
    padding:9px 16px;
    border-radius:999px;
    border:1px solid var(--neutral-border);
    background:var(--accent-soft);
    color:var(--accent-strong);
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .record-rating-btn:hover{border-color:var(--accent);}
  .record-rating-btn.is-active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .record-review-input{
    width:100%;
    min-height:72px;
    padding:12px 14px;
    border-radius:var(--radius-md);
    border:1px solid var(--neutral-border);
    background:var(--bg);
    color:var(--text);
    font-family:inherit;
    font-size:0.9rem;
    resize:vertical;
    margin-bottom:18px;
  }
  .record-review-input:focus{
    outline:none;
    border-color:var(--accent);
  }
  .record-save-btn{
    width:100%;
    padding:12px;
    border-radius:999px;
    border:none;
    background:var(--text);
    color:#fff;
    font-size:0.9rem;
    font-weight:600;
    cursor:pointer;
    transition:opacity .18s ease;
  }
  .record-save-btn:hover{opacity:.85;}
  .record-save-btn:disabled{opacity:.6; cursor:not-allowed;}
  .record-save-status{
    margin:10px 0 0;
    font-size:0.8rem;
    color:var(--text-soft);
    text-align:center;
    min-height:1em;
  }

  footer.site{
    padding:24px 0 40px;
    border-top:1px solid var(--neutral-border);
    text-align:center;
    font-size:0.78rem;
    color:var(--text-soft);
  }

  /* ---------- Responsive: 345 / 768 / 1440 ---------- */
  @media (min-width:768px){
    .wrap{padding:0 24px;}
    .quick-nav{padding-left:24px; padding-right:24px;}
    .pocket-grid{
      grid-template-columns:repeat(2, 1fr);
      gap:22px;
    }
  }
  @media (min-width:1440px){
    .pocket-grid{
      grid-template-columns:repeat(3, 1fr);
      gap:24px;
    }
  }
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="logo" href="index.html">I can <span>eat</span></a>
    <div class="header-actions">
      <div id="authSlot"></div>

  </div>
</header>

<nav class="quick-nav-wrap" aria-label="주요 기능 바로가기">
  <div class="quick-nav">
    <a class="quick-nav-item" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>
      홈
    </a>
    <a class="quick-nav-item" href="restaurants.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>

    </a>
    <a class="quick-nav-item is-active" href="mypage.html" id="navPocket">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>

<main class="wrap">

    <h1 class="pocket-heading">내가 담은 맛집</h1>

    <span class="record-panel-label">한줄평</span>
    <textarea class="record-review-input" id="recordReviewInput" maxlength="200" placeholder="이곳에 대한 한줄평을 남겨보세요"></textarea>

    <button type="button" class="record-save-btn" id="recordSaveBtn">저장</button>

<footer class="site">
  <div class="wrap">I can eat — 내가 담은 맛집은 나만 볼 수 있어요.</div>

<script src="auth.js"></script>
<script>
(function(){
  var hour = new Date().getHours();
  var daypart = (hour >= 6 && hour < 17) ? 'lunch' : 'dinner';
  document.documentElement.setAttribute('data-daypart', daypart);
})();

document.getElementById('navPocket').addEventListener('click', function(e){
  if (!window.icaneatAuth.getUser()) {
    e.preventDefault();
    window.icaneatAuth.requireLogin();
  }
});

(function(){
  'use strict';

  var statusMsg = document.getElementById('statusMsg');
  var pocketEmpty = document.getElementById('pocketEmpty');
  var pocketLists = document.getElementById('pocketLists');
  var togoGrid = document.getElementById('togoGrid');
  var togoEmpty = document.getElementById('togoEmpty');
  var visitedGrid = document.getElementById('visitedGrid');
  var visitedEmpty = document.getElementById('visitedEmpty');

  function showStatus(text, modifier){
    statusMsg.hidden = false;
    statusMsg.textContent = text;
    statusMsg.className = 'status-msg' + (modifier ? ' status-msg--' + modifier : '');
  }

  function hideStatus(){
    statusMsg.hidden = true;
    statusMsg.textContent = '';
    statusMsg.className = 'status-msg';
  }

  function showEmpty(show){
    pocketEmpty.hidden = !show;
  }

  // 두 그리드(가볼곳/가본곳)를 합쳐 전체가 비었으면 전역 빈 상태를,
  // 아니면 각 그룹별 빈 상태 문구를 갱신한다.
  function refreshEmptyStates(){
    var togoCount = togoGrid.querySelectorAll('.pocket-card').length;
    var visitedCount = visitedGrid.querySelectorAll('.pocket-card').length;

    if (togoCount + visitedCount === 0) {
      pocketLists.hidden = true;
      showEmpty(true);
      return;
    }
    showEmpty(false);
    pocketLists.hidden = false;
    togoEmpty.hidden = togoCount > 0;
    visitedEmpty.hidden = visitedCount > 0;
  }

  function formatDate(iso){
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '.' + mm + '.' + dd + ' 담음';
  }

  function buildGoogleMapsUrl(row){
    var query = (row.lat != null && row.lng != null)
      ? (row.lat + ',' + row.lng)
      : [row.place_name, row.address].filter(Boolean).join(' ');
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
  }

  function removeRow(row, card, removeBtn, supa){
    removeBtn.disabled = true;
    supa.from('saved_restaurants').delete().eq('id', row.id).then(function(res){
      if (res.error) {
        removeBtn.disabled = false;
        console.error('[맛집주머니] 삭제 실패:', res.error.message);
        alert('삭제하지 못했어요. 잠시 후 다시 시도해주세요.');
        return;
      }
      card.remove();
      refreshEmptyStates();
    });
  }

  function setVisitBtnState(btn, visited){
    btn.classList.toggle('is-visited', !!visited);
    btn.textContent = visited ? '안가봤어요' : '가봤어요';
    btn.setAttribute('aria-pressed', visited ? 'true' : 'false');
  }

  function gridFor(row){
    return row.visited ? visitedGrid : togoGrid;
  }

  function placeCard(row, supa){
    gridFor(row).appendChild(renderCard(row, supa));
  }

  // 가봤어요/안가봤어요 토글: DB에 visited를 반영한 뒤, 카드를 반대편 그리드로 옮긴다.
  function toggleVisited(row, card, btn, supa){
    btn.disabled = true;
    var nextVisited = !row.visited;
    supa.from('saved_restaurants').update({ visited: nextVisited }).eq('id', row.id).then(function(res){
      btn.disabled = false;
      if (res.error) {
        console.error('[맛집주머니] 방문 상태 변경 실패:', res.error.message);
        alert('처리하지 못했어요. 잠시 후 다시 시도해주세요.');
        return;
      }
      row.visited = nextVisited;
      card.remove();
      placeCard(row, supa);
      refreshEmptyStates();
    });
  }

  function renderCard(row, supa){
    var card = document.createElement('article');
    card.className = 'pocket-card';

    var removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'pocket-card-remove';
    removeBtn.setAttribute('aria-label', '맛집주머니에서 삭제');
    removeBtn.textContent = '×';
    removeBtn.addEventListener('click', function(e){
      e.stopPropagation();
      removeRow(row, card, removeBtn, supa);
    });
    card.appendChild(removeBtn);

    var name = document.createElement('h3');
    name.className = 'pocket-card-name';
    name.textContent = row.place_name || '이름 없음';
    card.appendChild(name);

    var address = document.createElement('p');
    address.className = 'pocket-card-address';
    address.textContent = row.address || '주소 정보 없음';
    card.appendChild(address);

    if (row.category_name) {
      var category = document.createElement('p');
      category.className = 'pocket-card-category';
      category.textContent = row.category_name;
      card.appendChild(category);
    }

    var ratingBadge = document.createElement('p');
    ratingBadge.className = 'pocket-card-rating-badge';
    ratingBadge.hidden = !row.rating;
    ratingBadge.textContent = row.rating || '';
    card.appendChild(ratingBadge);

    var reviewText = document.createElement('p');
    reviewText.className = 'pocket-card-review';
    reviewText.hidden = !row.review_text;
    reviewText.textContent = row.review_text ? ('"' + row.review_text + '"') : '';
    card.appendChild(reviewText);

    // 리뷰 모달에서 저장한 뒤 카드 전체를 다시 그리지 않고 이 두 엘리먼트만 갱신한다.
    card._recordEls = { rating: ratingBadge, review: reviewText };

    var date = document.createElement('p');
    date.className = 'pocket-card-date';
    date.textContent = formatDate(row.created_at);
    card.appendChild(date);

    var visitBtn = document.createElement('button');
    visitBtn.type = 'button';
    visitBtn.className = 'pocket-card-visit-btn';
    setVisitBtnState(visitBtn, row.visited);
    visitBtn.addEventListener('click', function(e){
      e.stopPropagation();
      toggleVisited(row, card, visitBtn, supa);
    });
    card.appendChild(visitBtn);

    var link = document.createElement('a');
    link.className = 'pocket-card-link';
    link.href = buildGoogleMapsUrl(row);
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = '구글맵에서 보기 →';
    card.appendChild(link);

    // 카드 클릭(삭제/방문토글/구글맵 링크 제외): 내 기록(평가·한줄평) 모달을 연다.
    card.addEventListener('click', function(e){
      if (e.target.closest('.pocket-card-remove')) return;
      if (e.target.closest('.pocket-card-visit-btn')) return;
      if (e.target.closest('.pocket-card-link')) return;
      openRecordModal(row, card, supa);
    });

    return card;
  }

  function loadPockets(){
    showStatus('불러오는 중…', 'loading');
    showEmpty(false);
    pocketLists.hidden = true;
    togoGrid.innerHTML = '';
    visitedGrid.innerHTML = '';

    var supa = window.icaneatAuth.getClient();
    supa.from('saved_restaurants')
      .select('id, place_id, place_name, category_name, address, lat, lng, created_at, visited, rating, review_text')
      .order('created_at', { ascending: false })
      .then(function(res){
        if (res.error) {
          showStatus('목록을 불러오지 못했어요. 잠시 후 다시 시도해주세요.', 'error');
          console.error('[맛집주머니] 조회 실패:', res.error.message);
          return;
        }

        var rows = res.data || [];
        hideStatus();

        if (rows.length === 0) {
          showEmpty(true);
          return;
        }

        rows.forEach(function(row){
          placeCard(row, supa);
        });
        refreshEmptyStates();
      });
  }

  function showLoginRequired(){
    togoGrid.innerHTML = '';
    visitedGrid.innerHTML = '';
    pocketLists.hidden = true;
    showEmpty(false);
    showStatus('로그인이 필요합니다.', 'error');
    window.icaneatAuth.requireLogin();
  }

  // ---------- 내 기록(평가·한줄평) 모달 ----------
  var recordModalOverlay = document.getElementById('recordModalOverlay');
  var recordName = document.getElementById('recordName');
  var recordMeta = document.getElementById('recordMeta');
  var recordRatingGroup = document.getElementById('recordRatingGroup');
  var recordReviewInput = document.getElementById('recordReviewInput');
  var recordSaveBtn = document.getElementById('recordSaveBtn');
  var recordSaveStatus = document.getElementById('recordSaveStatus');
  var recordCloseBtn = document.getElementById('recordCloseBtn');

  var activeRecordRow = null;
  var activeRecordCard = null;
  var activeRecordSupa = null;
  var pendingRating = null;

  function isRecordOpen(){
    return recordModalOverlay.classList.contains('open');
  }

  function updateRatingButtons(){
    Array.prototype.forEach.call(recordRatingGroup.querySelectorAll('.record-rating-btn'), function(btn){
      btn.classList.toggle('is-active', btn.dataset.rating === pendingRating);
    });
  }

  function openRecordModal(row, card, supa){
    activeRecordRow = row;
    activeRecordCard = card;
    activeRecordSupa = supa;
    pendingRating = row.rating || null;

    recordName.textContent = row.place_name || '이름 없음';
    recordMeta.textContent = [row.category_name, row.address].filter(Boolean).join(' · ');
    recordReviewInput.value = row.review_text || '';
    recordSaveStatus.textContent = '';
    updateRatingButtons();

    recordModalOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeRecordModal(){
    recordModalOverlay.classList.remove('open');
    document.body.style.overflow = '';
    activeRecordRow = null;
    activeRecordCard = null;
    activeRecordSupa = null;
  }

  recordRatingGroup.addEventListener('click', function(e){
    var btn = e.target.closest('.record-rating-btn');
    if (!btn) return;
    var value = btn.dataset.rating;
    // 이미 선택된 평가를 다시 누르면 해제.
    pendingRating = (pendingRating === value) ? null : value;
    updateRatingButtons();
  });

  recordCloseBtn.addEventListener('click', closeRecordModal);
  recordModalOverlay.addEventListener('click', function(e){
    if (e.target === recordModalOverlay) closeRecordModal();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && isRecordOpen()) closeRecordModal();
  });

  recordSaveBtn.addEventListener('click', function(){
    if (!activeRecordRow) return;
    var row = activeRecordRow;
    var card = activeRecordCard;
    var supa = activeRecordSupa;
    var reviewText = recordReviewInput.value.trim();

    recordSaveBtn.disabled = true;
    recordSaveStatus.textContent = '저장 중…';

    supa.from('saved_restaurants')
      .update({ rating: pendingRating, review_text: reviewText || null })
      .eq('id', row.id)
      .then(function(res){
        recordSaveBtn.disabled = false;
        if (res.error) {
          console.error('[맛집주머니] 내 기록 저장 실패:', res.error.message);
          recordSaveStatus.textContent = '저장하지 못했어요. 잠시 후 다시 시도해주세요.';
          return;
        }
        row.rating = pendingRating;
        row.review_text = reviewText || null;

        var els = card._recordEls;
        els.rating.hidden = !row.rating;
        els.rating.textContent = row.rating || '';
        els.review.hidden = !row.review_text;
        els.review.textContent = row.review_text ? ('"' + row.review_text + '"') : '';

        closeRecordModal();
      });
  });

  // 초기 렌더는 getSession()으로 직접 확정한 뒤 진행한다 — onChange는 auth.js의
  // getSession()이 비동기로 끝나기 전까지 currentUser=null로 먼저 한 번 불리므로,
  // 그 값을 그대로 쓰면 로그인 상태에서도 "로그인이 필요합니다"가 잠깐 깜빡인다.
  var initialCheckDone = false;
  var supa = window.icaneatAuth.getClient();

  supa.auth.getSession().then(function(res){
    initialCheckDone = true;
    var user = res.data.session ? res.data.session.user : null;
    if (user) loadPockets(); else showLoginRequired();
  });

  window.icaneatAuth.onChange(function(user){
    if (!initialCheckDone) return;
    if (user) loadPockets(); else showLoginRequired();
  });
})();
</script>

</body>
</html>
